<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS Back Office</title>
<style>
/* Same token system as the published mockups: one violet accent, neutral
   greys, and a dark mode that follows the OS. Kept deliberately small — this
   page ships inside the backend and has no build step. */
:root {
  --accent: #6d28d9;
  --accent-soft: #ede9fe;
  --bg: #f7f7f8;
  --surface: #ffffff;
  --border: #e4e4e7;
  --text: #18181b;
  --muted: #71717a;
  --danger: #dc2626;
  --danger-soft: #fef2f2;
  --ok: #16a34a;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --accent: #a78bfa;
    --accent-soft: #2e1065;
    --bg: #0b0b0e;
    --surface: #17171b;
    --border: #2a2a31;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --danger: #f87171;
    --danger-soft: #2a1215;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
button { font: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }
.hidden { display: none !important; }

/* ---- login ---- */
#login {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  width: 100%;
  max-width: 380px;
}
.card h1 { margin: 0 0 4px; font-size: 20px; }
.card p.sub { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=search], select {
  width: 100%;
  padding: 9px 11px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
}
.btn {
  background: var(--accent);
  color: #fff;
  border: 0;
  border-radius: 8px;
  padding: 10px 16px;
  font-weight: 600;
}
.btn:disabled { opacity: .55; cursor: default; }
.btn.ghost {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--border);
}
.btn.small { padding: 6px 10px; font-size: 13px; }
.err {
  background: var(--danger-soft);
  color: var(--danger);
  border-radius: 8px;
  padding: 9px 11px;
  font-size: 13px;
  margin-top: 12px;
}
.check {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 16px 0 0;
  font-size: 14px;
  color: var(--text);
  cursor: pointer;
}
.check input { width: auto; margin: 0; }
.fine { color: var(--muted); font-size: 12px; margin: 14px 0 0; line-height: 1.45; }

/* ---- shell ---- */
header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 5;
}
header .brand { font-weight: 700; }
header .who { margin-left: auto; color: var(--muted); font-size: 13px; }
nav { display: flex; gap: 4px; padding: 12px 20px 0; flex-wrap: wrap; }
nav button {
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 8px 14px;
  color: var(--muted);
  font-weight: 600;
}
nav button.on { background: var(--accent-soft); color: var(--accent); }
main { padding: 20px; max-width: 1180px; }

/* ---- widgets ---- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.tile .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.tile .v { font-size: 26px; font-weight: 700; margin-top: 4px; }
.tile.warn { border-color: var(--danger); }
.tile.warn .v { color: var(--danger); }
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-top: 18px;
  overflow: hidden;
}
.panel > h2 {
  margin: 0;
  padding: 13px 16px;
  font-size: 14px;
  border-bottom: 1px solid var(--border);
}
.panel .body { padding: 16px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.bad { background: var(--danger-soft); color: var(--danger); }
.toolbar { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.toolbar input[type=search] { max-width: 260px; }
.muted { color: var(--muted); }
.note { color: var(--muted); font-size: 13px; padding: 16px; }
input.price { width: 100px; text-align: right; font-variant-numeric: tabular-nums; }
.code {
  font-family: ui-monospace, Consolas, monospace;
  background: var(--accent-soft);
  color: var(--accent);
  padding: 10px 12px;
  border-radius: 8px;
  word-break: break-all;
  font-size: 13px;
  margin-top: 10px;
}
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.row > div { flex: 1 1 150px; }
/* ---- product master-detail ---- */
.master { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 16px; align-items: start; }
@media (max-width: 900px) { .master { grid-template-columns: 1fr; } }
.master .panel { margin-top: 0; }
.list { max-height: 62vh; overflow-y: auto; }
.listrow {
  display: block; width: 100%; text-align: left; background: transparent;
  border: 0; border-bottom: 1px solid var(--border); padding: 10px 16px;
  color: inherit; font: inherit;
}
.listrow:hover { background: var(--bg); }
.listrow.on { background: var(--accent-soft); }
.listmain { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.listsub { display: flex; gap: 10px; font-size: 12px; margin-top: 2px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { margin: 0; }
.hint { color: var(--muted); font-size: 12px; line-height: 1.45; }
.sub-head { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 26px 0 6px; }
.prices { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.prices input { text-align: right; font-variant-numeric: tabular-nums; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.checks .check { margin: 0; }
textarea {
  width: 100%; padding: 9px 11px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--bg); font: inherit; resize: vertical;
}
input[type=color] { width: 56px; height: 34px; padding: 2px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
.tile-preview {
  border: 1px solid var(--border); border-radius: 10px; padding: 10px;
  min-height: 84px; display: flex; align-items: flex-start;
  font-size: 13px; font-weight: 600; white-space: pre-line; line-height: 1.3;
}

/* ---- menu grid ---- */
.menugrid { display: grid; gap: 8px; padding: 16px; min-width: max-content; }
.cell {
  /* Square, because the till is: a menu page, a room of tables and the grid
     a manager arranges them on are the same shape, so what is arranged here
     is what a cashier sees. `aspect-ratio` rather than a fixed height, so a
     cell grows with the column and stays square while it does. */
  aspect-ratio: 1; min-height: 84px; overflow: hidden;
  border: 1px dashed var(--border); border-radius: 10px;
  background: transparent; color: var(--muted); font: inherit; padding: 8px;
  display: flex; flex-direction: column; justify-content: space-between;
  align-items: flex-start; text-align: left; gap: 4px;
}
.cell:hover { border-style: solid; border-color: var(--accent); }
.cell.filled { border: 1px solid var(--border); color: var(--text); font-weight: 600; }
.cell.held { outline: 3px solid var(--accent); outline-offset: 2px; }
.celltext { font-size: 12px; line-height: 1.25; white-space: pre-line; }
.cellprice { font-size: 11px; opacity: .85; font-variant-numeric: tabular-nums; }
.cellno { font-size: 22px; font-weight: 700; line-height: 1.1; }

/* A cell showing its picture. The name and price stay ON the button rather
   than beside it — the till draws all three in one tile, and an editor that
   showed them apart would not be showing what a cashier sees. */
.cell.hasimg { background-size: cover; background-position: center; }
.cell.hasimg .celltext, .cell.hasimg .cellprice {
  color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.85); opacity: 1;
}
.cropwrap { display: grid; place-items: center; padding: 8px 0; }
.cropper {
  width: 300px; height: 300px; border-radius: 10px; cursor: grab;
  background: #fff; border: 1px solid var(--border); touch-action: none;
}
.cropper:active { cursor: grabbing; }
.note.warn { color: var(--warn, #a15c00); }

.modal-back {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: grid; place-items: center; padding: 24px; z-index: 20;
}
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; width: min(520px, 100%);
}
.modal h2 { margin: 0 0 12px; font-size: 16px; }
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 12px; color: var(--muted); }
.field .hint { font-size: 11px; color: var(--muted); }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; }
.modal .err { margin: 0 0 8px; }

#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 8px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .18s;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>

<section id="login">
  <!-- A real form with named fields and an action, because that is what a
       browser password manager looks for before it offers to save anything.
       The submit is intercepted, but the shape has to be right. -->
  <form class="card" id="loginForm" method="post" action="/office">
    <h1>POS Back Office</h1>
    <p class="sub">Sign in with the account your provider set up.</p>
    <label for="email">Email</label>
    <input id="email" name="username" type="email" autocomplete="username"
           autocapitalize="none" spellcheck="false" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>
    <label class="check">
      <input id="remember" type="checkbox">
      <span>Keep me signed in on this device</span>
    </label>
    <div style="margin-top:18px"><button class="btn" style="width:100%" id="loginBtn" type="submit">Sign in</button></div>
    <div id="loginErr" class="err hidden"></div>
    <p class="fine">
      Your password is saved by the browser, not by this page. On a till or a
      shared office machine, leave the box unticked.
    </p>
  </form>
</section>

<div id="app" class="hidden">
  <header>
    <span class="brand">POS Back Office</span>
    <span id="company" class="muted"></span>
    <span class="who"><span id="who"></span> · <a href="#" id="logout">Sign out</a></span>
  </header>
  <nav>
    <button data-tab="dashboard" class="on">Dashboard</button>
    <button data-tab="products">Products &amp; prices</button>
    <button data-tab="menu">Menu layout</button>
    <button data-tab="floor">Floor plan</button>
    <button data-tab="devices">Devices</button>
    <button data-tab="sales">Sales</button>
  </nav>
  <main>
    <section id="tab-dashboard"></section>
    <section id="tab-products" class="hidden"></section>
    <section id="tab-menu" class="hidden"></section>
    <section id="tab-floor" class="hidden"></section>
    <section id="tab-devices" class="hidden"></section>
    <section id="tab-sales" class="hidden"></section>
  </main>
</div>

<div id="toast"></div>

<script>
'use strict';

// Where the SESSION TOKEN lives — never the password. Storing a password in
// the browser's storage would put a working credential in reach of any script
// on the page; saving it is the password manager's job, which is why the form
// above is a real form with autocomplete attributes.
//
// sessionStorage by default, so a shared back-office machine forgets when the
// tab closes. "Keep me signed in" moves it to localStorage, which survives a
// restart — but only until the token's own 12-hour expiry, which no checkbox
// extends.
const KEY = 'pos.office.token';
const store = () =>
  localStorage.getItem(KEY) ? localStorage : sessionStorage;
let token = localStorage.getItem(KEY) || sessionStorage.getItem(KEY) || '';
let branches = [];

const $ = (s, r = document) => r.querySelector(s);
const el = (t, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(t), props);
  for (const k of [].concat(kids)) n.append(k);
  return n;
};

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

// Halalas are the unit everywhere in this product. The conversion to a decimal
// happens here and only here, so no arithmetic upstream ever sees a float.
const money = h => (h == null ? '—' : (h / 100).toFixed(2));
const parseMoney = s => {
  const v = Number(String(s).trim());
  return Number.isFinite(v) && v >= 0 ? Math.round(v * 100) : null;
};
const when = iso => {
  if (!iso) return 'never';
  const d = new Date(iso);
  return d.toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'short' });
};

async function api(path, opts = {}) {
  const res = await fetch('/v1/office' + path, {
    ...opts,
    headers: {
      'content-type': 'application/json',
      ...(token ? { authorization: 'Bearer ' + token } : {}),
      ...(opts.headers || {}),
    },
  });
  if (res.status === 401) { signOut(); throw new Error('Session expired — sign in again'); }
  const body = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw new Error((body && (body.detail || body.message)) || ('Request failed (' + res.status + ')'));
  return body;
}

// ---------------------------------------------------------------- session

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'), err = $('#loginErr');
  btn.disabled = true;
  err.classList.add('hidden');
  try {
    const out = await api('/login', {
      method: 'POST',
      body: JSON.stringify({ email: $('#email').value, password: $('#password').value }),
    });
    token = out.token;
    // Write to one and clear the other, so unticking the box on a shared
    // machine actually forgets rather than leaving a stale token behind.
    const keep = $('#remember').checked;
    (keep ? localStorage : sessionStorage).setItem(KEY, token);
    (keep ? sessionStorage : localStorage).removeItem(KEY);
    await start(out);
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.remove('hidden');
  } finally {
    btn.disabled = false;
  }
});

function signOut() {
  token = '';
  // Both, unconditionally: signing out has to mean signed out wherever the
  // token happened to be kept.
  localStorage.removeItem(KEY);
  sessionStorage.removeItem(KEY);
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#password').value = '';
}
$('#logout').addEventListener('click', e => { e.preventDefault(); signOut(); });

async function start(me) {
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#who').textContent = me.name + ' (' + me.role + ')';
  $('#company').textContent = me.company_name;
  try { branches = await api('/branches'); } catch { branches = []; }
  show('dashboard');
}

document.querySelectorAll('nav button').forEach(b =>
  b.addEventListener('click', () => show(b.dataset.tab)));

function show(tab) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  ['dashboard', 'products', 'menu', 'floor', 'devices', 'sales'].forEach(t =>
    $('#tab-' + t).classList.toggle('hidden', t !== tab));
  ({ dashboard: renderDashboard, products: renderProducts, menu: renderMenu,
     floor: renderFloor, devices: renderDevices, sales: renderSales })[tab]();
}

function into(id, node) {
  const host = $('#tab-' + id);
  host.replaceChildren(node);
}
function panel(title, child) {
  const p = el('section', { className: 'panel' }, [el('h2', { textContent: title })]);
  p.append(child);
  return p;
}
function loading(id) { into(id, el('p', { className: 'note', textContent: 'Loading…' })); }
function failed(id, ex) { into(id, el('p', { className: 'err', textContent: ex.message })); }

// -------------------------------------------------------------- dashboard

async function renderDashboard() {
  loading('dashboard');
  try {
    const d = await api('/dashboard');
    const wrap = el('div');

    const tiles = el('div', { className: 'tiles' });
    const tile = (k, v, warn) => {
      const t = el('div', { className: 'tile' + (warn ? ' warn' : '') });
      t.append(el('div', { className: 'k', textContent: k }));
      t.append(el('div', { className: 'v', textContent: v }));
      return t;
    };
    tiles.append(
      tile('Sales today', d.sale_count),
      tile('Gross (SAR)', money(d.gross_total)),
      tile('VAT (SAR)', money(d.vat_total)),
      tile('Net (SAR)', money(d.net_total)),
      // These two are the point of the dashboard. An unsigned sale is not a
      // queue that drains — it is an invoice that was never legally issued.
      tile('Unsigned sales', d.unsigned_sales, d.unsigned_sales > 0),
      tile('Silent devices', d.silent_devices, d.silent_devices > 0),
    );
    wrap.append(tiles);

    if (d.unsigned_sales > 0) {
      wrap.append(el('div', { className: 'err', style: 'margin-top:16px',
        textContent: d.unsigned_sales + ' sale(s) today closed without a ZATCA stamp. ' +
          'Those receipts are not tax invoices and the server refused them. Check the ' +
          'device is provisioned for signing, then see the Sales tab.' }));
    }

    const table = el('table');
    table.append(el('thead', {}, el('tr', {}, [
      el('th', { textContent: 'Sale type' }),
      el('th', { className: 'num', textContent: 'Count' }),
      el('th', { className: 'num', textContent: 'Gross (SAR)' }),
    ])));
    const tb = el('tbody');
    if (!d.by_sale_type.length) {
      tb.append(el('tr', {}, el('td', { colSpan: 3, className: 'muted', textContent: 'No sales on ' + d.business_date })));
    }
    for (const r of d.by_sale_type) {
      tb.append(el('tr', {}, [
        el('td', { textContent: r.name }),
        el('td', { className: 'num', textContent: r.count }),
        el('td', { className: 'num', textContent: money(r.gross) }),
      ]));
    }
    table.append(tb);
    wrap.append(panel('Trade mix — ' + d.business_date, el('div', { className: 'scroll' }, table)));
    into('dashboard', wrap);
  } catch (ex) { failed('dashboard', ex); }
}

// --------------------------------------------------------------- products

// Master-detail, the shape of the product screen this replaces: a browsable
// list on the left, one product open on the right. With 560 products a flat
// table with inline price boxes stops being navigable.
let productSearch = '', zeroOnly = false, categoryFilter = '';
let selectedProductId = null;
let categories = [], stations = [], questions = [];

const TIERS = 'abcdefghij'.split('');
// Which tier a sale type charges is configured per type; A and B are the two
// that carry the money at this customer, so they lead and are labelled.
const TIER_LABEL = { a: 'A · Walk-in', b: 'B · Aggregator', j: 'J · Comp' };

async function renderProducts() {
  loading('products');
  try {
    if (!categories.length) {
      try { categories = await api('/report-categories'); } catch { categories = []; }
    }
    if (!stations.length) {
      try { stations = await api('/kitchen-stations'); } catch { stations = []; }
    }
    if (!questions.length) {
      try { questions = await api('/questions'); } catch { questions = []; }
    }

    const qs = new URLSearchParams();
    if (productSearch) qs.set('search', productSearch);
    if (zeroOnly) qs.set('only_zero_price', 'true');
    if (categoryFilter) qs.set('report_no', categoryFilter);
    const rows = await api('/products' + (qs.toString() ? '?' + qs : ''));

    const wrap = el('div', { className: 'master' });
    wrap.append(productList(rows), el('div', { id: 'productDetail' }));
    into('products', wrap);

    if (selectedProductId && rows.some(r => r.id === selectedProductId)) {
      openProduct(selectedProductId);
    } else {
      showDetailPlaceholder(rows.length);
    }
  } catch (ex) { failed('products', ex); }
}

function productList(rows) {
  const panel = el('section', { className: 'panel' },
    [el('h2', { textContent: 'Products' })]);

  const bar = el('div', { className: 'toolbar' });
  const search = el('input', { type: 'search', value: productSearch,
    placeholder: 'Name or number…', ariaLabel: 'Search products' });
  search.addEventListener('change', () => {
    productSearch = search.value; renderProducts();
  });

  const cat = el('select', { ariaLabel: 'Filter by report category' });
  cat.append(el('option', { value: '', textContent: 'All categories' }));
  for (const c of categories) {
    cat.append(el('option', {
      value: String(c.report_no),
      textContent: `${c.name} (${c.product_count})`,
      selected: String(c.report_no) === categoryFilter,
    }));
  }
  cat.addEventListener('change', () => {
    categoryFilter = cat.value; renderProducts();
  });

  const zbtn = el('button', { className: 'btn small ' + (zeroOnly ? '' : 'ghost'),
    textContent: 'Priced zero' });
  zbtn.addEventListener('click', () => { zeroOnly = !zeroOnly; renderProducts(); });

  const add = el('button', { className: 'btn small', textContent: 'New product' });
  add.addEventListener('click', () => openProduct(null));

  bar.append(search, cat, zbtn, add);
  panel.append(bar);

  const list = el('div', { className: 'list' });
  for (const p of rows) {
    const row = el('button', {
      className: 'listrow' + (p.id === selectedProductId ? ' on' : ''),
    });
    row.append(
      el('div', { className: 'listmain' }, [
        el('span', { textContent: p.descript }),
        p.is_active ? el('span') :
          el('span', { className: 'pill bad', textContent: 'inactive' }),
      ]),
      el('div', { className: 'listsub' }, [
        el('span', { className: 'muted', textContent: '#' + p.prodnum }),
        el('span', { className: 'muted', textContent: money(p.price_a) }),
      ]),
    );
    row.addEventListener('click', () => {
      selectedProductId = p.id;
      document.querySelectorAll('.listrow.on')
        .forEach(n => n.classList.remove('on'));
      row.classList.add('on');
      openProduct(p.id);
    });
    list.append(row);
  }
  if (!rows.length) {
    list.append(el('p', { className: 'note', textContent: 'Nothing matches.' }));
  }
  panel.append(list);
  panel.append(el('p', { className: 'note',
    textContent: rows.length + ' shown' }));
  return panel;
}

function showDetailPlaceholder(count) {
  $('#productDetail').replaceChildren(
    el('section', { className: 'panel' }, [
      el('h2', { textContent: 'Product setup' }),
      el('p', { className: 'note', textContent: count
        ? 'Pick a product on the left, or add a new one.'
        : 'No products match the current filter.' }),
    ]),
  );
}

async function openProduct(id) {
  const host = $('#productDetail');
  host.replaceChildren(el('p', { className: 'note', textContent: 'Loading…' }));

  let p;
  if (id) {
    try { p = await api('/products/' + id); }
    catch (ex) { return host.replaceChildren(
      el('p', { className: 'err', textContent: ex.message })); }
  } else {
    // A blank product. price_a is required by the API, so it starts at zero
    // and the zero-price filter will find it until someone sets it.
    p = { prodnum: '', descript: '', descript_ar: '', print_des: '',
          price_a: 0, tax_applies: true, is_weighed: false,
          manual_price: false, is_modifier: false, is_active: true,
          print_loc: 0, ref_code: '', unit_des: '', menu_ids: [],
          question_nos: [] };
    for (const t of TIERS) if (p['price_' + t] == null) p['price_' + t] = null;
  }

  const isNew = !id;
  const fields = {};
  const form = el('div', { className: 'body' });

  const field = (label, control, hint) => {
    const box = el('div', { className: 'field' });
    box.append(el('label', { textContent: label }));
    box.append(control);
    if (hint) box.append(el('div', { className: 'hint', textContent: hint }));
    return box;
  };
  const text = (key, value, opts = {}) => {
    const input = el('input', Object.assign(
      { type: 'text', value: value ?? '' }, opts));
    fields[key] = input;
    return input;
  };

  // ---- identity ----
  const idRow = el('div', { className: 'row' });
  idRow.append(
    field('Product number', text('prodnum', p.prodnum,
      { type: 'number', min: '1', disabled: !isNew }),
      isNew ? 'Used by kitchen tickets and reports. Cannot be changed later.'
            : 'Fixed once created.'),
    field('Description', text('descript', p.descript)),
  );
  form.append(idRow);

  const nameRow = el('div', { className: 'row' });
  nameRow.append(
    field('Arabic name', text('descript_ar', p.descript_ar),
      'Printed on the receipt. ZATCA expects Arabic.'),
    field('Kitchen ticket name', text('print_des', p.print_des),
      'What the kitchen sees. Blank uses the description.'),
  );
  form.append(nameRow);

  const metaRow = el('div', { className: 'row' });
  const catSel = el('select');
  catSel.append(el('option', { value: '', textContent: '— none —' }));
  for (const c of categories) {
    catSel.append(el('option', { value: String(c.report_no),
      textContent: c.name, selected: c.report_no === p.report_no }));
  }
  fields.report_no = catSel;
  metaRow.append(
    field('Report category', catSel, 'What sales reports group this under.'),
    field('Reference code', text('ref_code', p.ref_code)),
    field('Unit', text('unit_des', p.unit_des), 'e.g. KG for weighed items.'),
  );
  form.append(metaRow);

  // ---- pricing ----
  form.append(el('h3', { className: 'sub-head', textContent: 'Pricing' }));
  form.append(el('p', { className: 'hint', textContent:
    'VAT-inclusive, in SAR. The sale type decides which tier is charged — ' +
    'aggregators pay B, and the gap from A is their commission. Leaving B ' +
    'empty does not fall back to A: the till refuses the sale instead.' }));

  const priceGrid = el('div', { className: 'prices' });
  for (const t of TIERS) {
    const value = p['price_' + t];
    const input = el('input', {
      type: 'number', step: '0.01', min: '0',
      value: value == null ? '' : money(value),
      placeholder: t === 'a' ? '0.00' : '—',
      ariaLabel: 'Price ' + t.toUpperCase(),
    });
    fields['price_' + t] = input;
    priceGrid.append(field(TIER_LABEL[t] || t.toUpperCase(), input));
  }
  form.append(priceGrid);

  // ---- routing ----
  form.append(el('h3', { className: 'sub-head', textContent: 'Kitchen routing' }));
  const routing = el('div', { className: 'checks' });
  const stationBoxes = [];
  for (const s of stations) {
    const box = el('input', { type: 'checkbox',
      checked: (p.print_loc & (1 << s.station_no)) !== 0,
      ariaLabel: 'Send to ' + s.name });
    stationBoxes.push({ box, station_no: s.station_no });
    routing.append(el('label', { className: 'check' }, [box,
      el('span', { textContent: s.name })]));
  }
  if (!stations.length) {
    routing.append(el('p', { className: 'hint',
      textContent: 'No kitchen stations configured for this branch.' }));
  }
  form.append(routing);
  form.append(el('p', { className: 'hint', textContent:
    'Station numbers are the printer ports carried over from the old system, ' +
    'so imported routing keeps working. Nothing ticked means no kitchen ticket.' }));

  // ---- forced questions ----
  // PixelPoint's five ordered slots. A prompt asks the cashier to choose
  // something that comes with the item — "1 DRINKS", "Bread Selection" — and
  // the choice is rung and sent to the kitchen with the meal.
  form.append(el('h3', { className: 'sub-head', textContent: 'Forced questions' }));
  const qSlots = [];
  const qBox = el('div');
  for (let slot = 0; slot < 5; slot++) {
    const sel = el('select', { ariaLabel: 'Question ' + (slot + 1) });
    sel.append(el('option', { value: '', textContent: 'NO QUESTION' }));
    for (const q of questions) {
      const pick = q.pick_count > 1 ? ` — pick ${q.pick_count}` : '';
      sel.append(el('option', {
        value: String(q.question_no),
        textContent: `${q.prompt}${pick}  (${q.choices.length} choices)`,
        selected: p.question_nos[slot] === q.question_no,
      }));
    }
    qSlots.push(sel);
    qBox.append(el('div', { style: 'margin-bottom:8px' }, sel));
  }
  form.append(qBox);
  form.append(el('p', { className: 'hint', textContent:
    'Asked in this order when the item is rung. Leave a slot on NO QUESTION '
    + 'to skip it. A prompt with no choices configured cannot be answered, so '
    + 'the till would stall on it.' }));

  // ---- till button ----
  form.append(el('h3', { className: 'sub-head', textContent: 'Till button' }));
  form.append(el('p', { className: 'hint', textContent:
    'What the cashier sees. The label is separate from the description ' +
    'because a tile has to fit it, and the colour is how staff find an item ' +
    'before they read it — the imported menu uses 28 of them.' }));

  const btnRow = el('div', { className: 'row' });
  const btnText = el('textarea', { rows: 3, value: p.button_text || '',
    placeholder: p.descript, ariaLabel: 'Button label' });
  fields.button_text = btnText;

  const colour = (key, label) => {
    const value = p[key];
    const picker = el('input', { type: 'color', value: value || '#FFFFFF',
      ariaLabel: label, disabled: !value });
    const useTheme = el('input', { type: 'checkbox', checked: !value,
      ariaLabel: label + ': use the theme' });
    useTheme.addEventListener('change', () => {
      picker.disabled = useTheme.checked;
      preview();
    });
    picker.addEventListener('input', preview);
    fields[key] = { picker, useTheme };
    return el('div', {}, [
      picker,
      el('label', { className: 'check' }, [useTheme,
        el('span', { textContent: 'Use theme' })]),
    ]);
  };

  const previewTile = el('div', { className: 'tile-preview' });
  function preview() {
    const back = fields.back_color.useTheme.checked
      ? '' : fields.back_color.picker.value;
    const fore = fields.fore_color.useTheme.checked
      ? '' : fields.fore_color.picker.value;
    previewTile.style.background = back || 'var(--surface)';
    previewTile.style.color = fore || 'var(--text)';
    previewTile.textContent =
      (btnText.value || fields.descript.value || p.descript || '').trim();
  }
  btnText.addEventListener('input', preview);

  btnRow.append(
    field('Button label', btnText, 'One line per row. Blank uses the description.'),
    field('Background', colour('back_color', 'Button background')),
    field('Text colour', colour('fore_color', 'Button text colour')),
    field('Preview', previewTile),
  );
  form.append(btnRow);
  preview();

  // ---- flags ----
  form.append(el('h3', { className: 'sub-head', textContent: 'Behaviour' }));

  const flags = el('div', { className: 'checks' });
  const flag = (key, label, hint) => {
    const box = el('input', { type: 'checkbox', checked: !!p[key],
      ariaLabel: label });
    fields[key] = box;
    flags.append(el('label', { className: 'check', title: hint || '' },
      [box, el('span', { textContent: label })]));
  };
  flag('is_active', 'Available on tills');
  flag('tax_applies', 'VAT applies');
  flag('is_weighed', 'Sold by weight');
  flag('manual_price', 'Price typed at the till');
  flag('is_modifier', 'Modifier, not a menu item');
  form.append(flags);

  // ---- where it appears ----
  if (!isNew) {
    form.append(el('h3', { className: 'sub-head', textContent: 'On menu screens' }));
    form.append(el('p', { className: 'hint', textContent: p.menu_ids.length
      ? 'Screens ' + p.menu_ids.join(', ') +
        '. Moving buttons is a menu-layout job, not done here.'
      : 'Not on any menu screen, so no till can ring it.' }));
  }

  // ---- save ----
  const save = el('button', { className: 'btn',
    textContent: isNew ? 'Create product' : 'Save changes' });
  const actions = el('div', { style: 'margin-top:20px; display:flex; gap:8px' });
  actions.append(save);
  if (!isNew) {
    const cancel = el('button', { className: 'btn ghost', textContent: 'Revert' });
    cancel.addEventListener('click', () => openProduct(id));
    actions.append(cancel);
  }
  form.append(actions);

  save.addEventListener('click', async () => {
    const body = {};
    const put = (key, value) => { if (isNew || value !== p[key]) body[key] = value; };

    if (isNew) {
      const num = Number(fields.prodnum.value);
      if (!Number.isInteger(num) || num < 1) {
        return toast('Product number must be a whole number');
      }
      body.prodnum = num;
    }
    if (!fields.descript.value.trim()) return toast('Description is required');
    put('descript', fields.descript.value.trim());

    for (const key of ['descript_ar', 'print_des', 'ref_code', 'unit_des']) {
      put(key, fields[key].value.trim() || null);
    }
    body.report_no = fields.report_no.value ? Number(fields.report_no.value) : null;

    for (const t of TIERS) {
      const raw = fields['price_' + t].value.trim();
      if (raw === '') {
        if (t === 'a') return toast('Walk-in price (A) is required');
        put('price_' + t, null);
      } else {
        const halalas = parseMoney(raw);
        if (halalas === null) return toast(`Price ${t.toUpperCase()} must be a number`);
        put('price_' + t, halalas);
      }
    }

    let printLoc = 0;
    for (const { box, station_no } of stationBoxes) {
      if (box.checked) printLoc |= (1 << station_no);
    }
    // Bits for ports with no configured station are preserved, so editing a
    // product does not quietly unroute it from a station nobody has named.
    const known = stations.reduce((m, s) => m | (1 << s.station_no), 0);
    put('print_loc', printLoc | (p.print_loc & ~known));

    for (const key of ['is_active', 'tax_applies', 'is_weighed',
                       'manual_price', 'is_modifier']) {
      put(key, fields[key].checked);
    }

    // Sent whole, in slot order, skipping the empty ones — the API replaces
    // the list rather than patching a slot at a time.
    const chosen = qSlots.map(s => s.value).filter(Boolean).map(Number);
    if (new Set(chosen).size !== chosen.length) {
      return toast('The same question cannot be asked twice for one item');
    }
    if (isNew || chosen.join(',') !== p.question_nos.join(',')) {
      body.question_nos = chosen;
    }

    put('button_text', fields.button_text.value.trim() || null);
    for (const key of ['fore_color', 'back_color']) {
      const { picker, useTheme } = fields[key];
      // Uppercase to match what the migration writes, so a save with no
      // visible change does not register as one.
      put(key, useTheme.checked ? null : picker.value.toUpperCase());
    }

    if (!isNew && !Object.keys(body).length) return toast('Nothing changed');

    save.disabled = true;
    try {
      if (isNew) {
        const made = await api('/products', {
          method: 'POST', body: JSON.stringify(body) });
        selectedProductId = made.id;
        toast(made.descript + ' created — put it on a menu screen to sell it');
      } else {
        await api('/products/' + id, {
          method: 'PATCH', body: JSON.stringify(body) });
        toast('Saved — tills will pull it on their next sync');
      }
      categories = [];
      await renderProducts();
    } catch (ex) {
      toast(ex.message);
    } finally {
      save.disabled = false;
    }
  });

  host.replaceChildren(el('section', { className: 'panel' }, [
    el('h2', { textContent: isNew ? 'New product'
      : `${p.descript}  ·  #${p.prodnum}` }),
    form,
  ]));
}

// ------------------------------------------------------------ menu layout
//
// A page is a grid, and where a button sits is what staff navigate by — they
// reach for a position before they read a label. So this draws the real grid
// with the real colours, rather than listing buttons in some order.

let selectedScreenId = null;
let heldButtonId = null;   // picked up, waiting for a destination cell
let menuLevel = 'pages';   // 'menus' = the grid a till lands on; 'pages' = one page
let selectedMenuId = null;

async function renderMenu() {
  if (menuLevel === 'menus') return renderMenuGrid();
  loading('menu');
  try {
    const screens = await api('/menu-screens');
    const wrap = el('div', { className: 'master' });
    wrap.append(pageList(screens), el('div', { id: 'menuCanvas' }));
    into('menu', wrap);

    const chosen = screens.find(s => s.id === selectedScreenId) || screens[0];
    if (chosen) {
      selectedScreenId = chosen.id;
      await openPage(chosen);
    } else {
      $('#menuCanvas').replaceChildren(el('section', { className: 'panel' }, [
        el('h2', { textContent: 'Order page' }),
        el('p', { className: 'note', textContent: 'No pages yet.' }),
      ]));
    }
  } catch (ex) { failed('menu', ex); }
}

/// Two levels, one tab. A menu is the grid of page tiles a till lands on; a
/// page is the grid of product buttons inside it. Switching between them is
/// the same move a cashier makes, so it is one control rather than two tabs.
function levelSwitch() {
  const bar = el('div', { className: 'toolbar' });
  for (const [value, label] of [['menus', 'Menus'], ['pages', 'Order pages']]) {
    const b = el('button', {
      className: 'btn small ' + (menuLevel === value ? '' : 'ghost'),
      textContent: label,
    });
    b.addEventListener('click', () => {
      menuLevel = value;
      heldButtonId = null;
      renderMenu();
    });
    bar.append(b);
  }
  return bar;
}

function pageList(screens) {
  const panel = el('section', { className: 'panel' },
    [el('h2', { textContent: 'Order pages' }), levelSwitch()]);

  const bar = el('div', { className: 'toolbar' });
  const add = el('button', { className: 'btn small', textContent: 'New page' });
  add.addEventListener('click', newPage);
  bar.append(add, el('span', { className: 'muted',
    textContent: screens.length + ' pages' }));
  panel.append(bar);

  const list = el('div', { className: 'list' });
  for (const s of screens) {
    const row = el('button', {
      className: 'listrow' + (s.id === selectedScreenId ? ' on' : ''),
    });
    row.append(
      el('div', { className: 'listmain' }, [
        el('span', { textContent: s.name }),
        s.is_active ? el('span')
          : el('span', { className: 'pill bad', textContent: 'inactive' }),
      ]),
      el('div', { className: 'listsub' }, [
        el('span', { className: 'muted', textContent: '#' + s.menu_id }),
        el('span', { className: 'muted',
          textContent: s.button_count + ' buttons' }),
      ]),
    );
    row.addEventListener('click', () => {
      selectedScreenId = s.id;
      heldButtonId = null;
      renderMenu();
    });
    list.append(row);
  }
  panel.append(list);
  return panel;
}

async function newPage() {
  let made = null;
  const done = await formModal({
    title: 'New order page',
    confirm: 'Create page',
    fields: [
      { name: 'name', label: 'Name', placeholder: 'Shawarma, Grill, Drinks…' },
      { name: 'menu_id', label: 'Page number', type: 'number', min: 1,
        hint: 'What tills and imports refer to it by.' },
      { name: 'across', label: 'Columns', type: 'number', value: 6, min: 1, max: 20 },
      { name: 'down', label: 'Rows', type: 'number', value: 5, min: 1, max: 20 },
    ],
    submit: async v => {
      if (!v.name) return 'Give the page a name.';
      const menuId = Number(v.menu_id);
      if (!Number.isInteger(menuId) || menuId < 1) {
        return 'Page numbers are whole numbers from 1.';
      }
      try {
        made = await api('/menu-screens', { method: 'POST',
          body: JSON.stringify({
            menu_id: menuId, name: v.name,
            buttons_across: Number(v.across) || 6,
            buttons_down: Number(v.down) || 5 }) });
      } catch (ex) { return ex.message; }
      return null;
    },
  });
  if (!done || !made) return;
  selectedScreenId = made.id;
  toast('Page created');
  renderMenu();
}

async function openPage(screen) {
  const host = $('#menuCanvas');
  host.replaceChildren(el('p', { className: 'note', textContent: 'Loading…' }));

  let buttons;
  try { buttons = await api(`/menu-screens/${screen.id}/buttons`); }
  catch (ex) { return host.replaceChildren(
    el('p', { className: 'err', textContent: ex.message })); }

  // The imported pages have no grid size — PixelPoint stored 0 for every one
  // — so the page is drawn just big enough for what is on it, plus a row and
  // column of room to place into.
  const across = screen.buttons_across
    || Math.min(20, Math.max(screen.used_across + 1, 4));
  const down = screen.buttons_down
    || Math.min(20, Math.max(screen.used_down + 1, 3));

  const byCell = new Map();
  for (const b of buttons) byCell.set(`${b.pos_x},${b.pos_y}`, b);

  const panel = el('section', { className: 'panel' }, [
    el('h2', { textContent: `${screen.name}  ·  page ${screen.menu_id}` }),
  ]);

  // ---- page settings ----
  const bar = el('div', { className: 'toolbar' });
  const nameInput = el('input', { type: 'text', value: screen.name,
    ariaLabel: 'Page name', style: 'max-width:200px' });
  const acrossInput = el('input', { type: 'number', min: '1', max: '20',
    value: across, ariaLabel: 'Columns', style: 'width:70px' });
  const downInput = el('input', { type: 'number', min: '1', max: '20',
    value: down, ariaLabel: 'Rows', style: 'width:70px' });
  const savePage = el('button', { className: 'btn small', textContent: 'Save page' });
  savePage.addEventListener('click', async () => {
    try {
      await api('/menu-screens/' + screen.id, { method: 'PATCH',
        body: JSON.stringify({
          name: nameInput.value.trim(),
          buttons_across: Number(acrossInput.value),
          buttons_down: Number(downInput.value),
        }) });
      toast('Page saved — tills pull it on their next sync');
      renderMenu();
    } catch (ex) { toast(ex.message); }
  });
  bar.append(nameInput,
    el('span', { className: 'muted', textContent: 'grid' }),
    acrossInput, el('span', { className: 'muted', textContent: '×' }), downInput,
    savePage);
  panel.append(bar);

  // ---- the grid ----
  const grid = el('div', { className: 'menugrid' });
  grid.style.gridTemplateColumns = `repeat(${across}, minmax(90px, 1fr))`;

  for (let y = 1; y <= down; y++) {
    for (let x = 1; x <= across; x++) {
      const b = byCell.get(`${x},${y}`);
      const cell = el('button', {
        className: 'cell' + (b ? ' filled' : '')
          + (b && b.id === heldButtonId ? ' held' : ''),
        title: b ? `${b.descript}  ·  #${b.prodnum}` : `Empty  (${x}, ${y})`,
      });
      if (b) {
        cell.style.background = b.back_color || '';
        cell.style.color = b.fore_color || '';
        if (b.has_image) paintCell(cell, b.prodnum, b.image_version);
        cell.append(
          el('span', { className: 'celltext',
            textContent: b.button_text || b.descript }),
          el('span', { className: 'cellprice', textContent: money(b.price_a) }),
        );
        if (!b.is_active) cell.append(
          el('span', { className: 'pill bad', textContent: 'inactive' }));
      }
      cell.addEventListener('click', () => onCell(screen, b, x, y));
      grid.append(cell);
    }
  }
  panel.append(el('div', { className: 'scroll' }, grid));

  const held = buttons.find(b => b.id === heldButtonId);
  panel.append(el('p', { className: 'note', textContent: held
    ? `Holding "${held.descript}". Click a cell to move it there — landing on `
      + 'another button swaps the two. Click it again to put it down.'
    : 'Click a button to pick it up and move it, or an empty cell to place a '
      + 'product. Colours and labels come from the product.' }));

  if (held) {
    // On the held button rather than on every cell: the grid is a layout
    // tool, and a picture button in all thirty cells would be thirty things
    // to mis-click while moving items around.
    const picture = el('button', { className: 'btn small',
      textContent: held.has_image ? 'Change picture…' : 'Add a picture…' });
    picture.addEventListener('click', async () => {
      const changed = await imageModal(
        held.prodnum, held.descript, held.has_image);
      if (changed) renderMenu();
    });
    const remove = el('button', { className: 'btn small ghost',
      textContent: `Remove "${held.descript}" from this page` });
    remove.addEventListener('click', async () => {
      try {
        await api('/menu-buttons/' + held.id, { method: 'DELETE' });
        heldButtonId = null;
        toast('Removed');
        renderMenu();
      } catch (ex) { toast(ex.message); }
    });
    panel.append(el('div', { className: 'toolbar' }, [picture, remove]));
  }

  host.replaceChildren(panel);
}

// ---- button pictures ----------------------------------------------------
//
// A picture is read faster than a name, which is the point of putting one on a
// till button. It therefore has to be legible at the size a tile actually
// draws — square, and small — so the browser crops and resizes to exactly that
// before anything is uploaded. Doing it here rather than on the server keeps
// an image library out of the deployment, and it is also the only place a
// person can say which part of a photograph matters: an automatic centre crop
// takes the top off half of them.

let imageRules = null;
const imageUrls = new Map();          // 'prodnum:version' -> object URL

async function rules() {
  if (!imageRules) imageRules = await api('/image-rules');
  return imageRules;
}

/// The picture's bytes as something an <img> or CSS can point at.
///
/// Fetched rather than linked because the endpoint needs the session token,
/// which a bare src cannot send. Keyed by version, so a replaced picture is a
/// new entry and the old one is never shown again.
async function tileImage(prodnum, version) {
  const key = prodnum + ':' + version;
  if (imageUrls.has(key)) return imageUrls.get(key);
  try {
    const res = await fetch(`/v1/office/products/${prodnum}/image`, {
      headers: { Authorization: 'Bearer ' + token },
    });
    if (!res.ok) return null;
    const url = URL.createObjectURL(await res.blob());
    imageUrls.set(key, url);
    return url;
  } catch { return null; }
}

/// Paint a cell with its picture, dark enough underneath that the name and
/// price stay readable over a photograph of anything.
function paintCell(cell, prodnum, version) {
  tileImage(prodnum, version).then(url => {
    if (!url) return;
    // The same three stops the till uses in _imageTile. If these drift the
    // editor stops showing what a cashier will actually see, which is the
    // only reason to draw the picture here at all.
    cell.style.backgroundImage =
      'linear-gradient(to bottom, rgba(0,0,0,.40) 0%, rgba(0,0,0,.10) 45%, '
      + 'rgba(0,0,0,.80) 100%), url(' + url + ')';
    cell.classList.add('hasimg');
  });
}

/// Crop, zoom and upload one button's picture.
///
/// Returns true if anything changed. The dialog never uploads what was chosen
/// from disk — it uploads what is drawn in the frame, at the size a till
/// draws, so what a manager sees here is what a cashier gets.
async function imageModal(prodnum, name, hasImage) {
  const r = await rules();
  const kb = n => Math.round(n / 1024) + ' KB';

  return new Promise(resolve => {
    const back = el('div', { className: 'modal-back' });
    const box = el('div', { className: 'modal' });
    const error = el('p', { className: 'err hidden' });
    let changed = false;

    const close = () => {
      document.removeEventListener('keydown', onKey);
      back.remove();
      resolve(changed);
    };
    const onKey = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);

    // ---- the frame -------------------------------------------------------
    const SIDE = 300;                 // preview size; the export is r.ideal_px
    const canvas = el('canvas', { className: 'cropper', width: SIDE, height: SIDE });
    const ctx2d = canvas.getContext('2d');
    let img = null, zoom = 1, offX = 0, offY = 0, drag = null;

    // "Cover" — the smallest scale at which the frame is entirely filled.
    // Below it the tile would show blank edges, so it is also the floor.
    const cover = () => Math.max(SIDE / img.width, SIDE / img.height);

    function clamp() {
      const s = cover() * zoom;
      const maxX = Math.max(0, (img.width * s - SIDE) / 2);
      const maxY = Math.max(0, (img.height * s - SIDE) / 2);
      offX = Math.min(maxX, Math.max(-maxX, offX));
      offY = Math.min(maxY, Math.max(-maxY, offY));
    }

    function draw(target = canvas, side = SIDE) {
      const c = target.getContext('2d');
      // White, not transparent: the export is JPEG, and transparency there
      // becomes black — which turns a logo with a cut-out background into a
      // black square on the till.
      c.fillStyle = '#fff';
      c.fillRect(0, 0, side, side);
      if (!img) return;
      const k = side / SIDE;
      const s = cover() * zoom * k;
      c.imageSmoothingQuality = 'high';
      c.drawImage(
        img,
        side / 2 + offX * k - img.width * s / 2,
        side / 2 + offY * k - img.height * s / 2,
        img.width * s, img.height * s,
      );
    }

    canvas.addEventListener('pointerdown', e => {
      if (!img) return;
      drag = { x: e.clientX, y: e.clientY };
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', e => {
      if (!drag) return;
      offX += e.clientX - drag.x;
      offY += e.clientY - drag.y;
      drag = { x: e.clientX, y: e.clientY };
      clamp(); draw();
    });
    const stop = () => { drag = null; };
    canvas.addEventListener('pointerup', stop);
    canvas.addEventListener('pointercancel', stop);

    const zoomInput = el('input', {
      type: 'range', min: '100', max: '300', value: '100',
      ariaLabel: 'Zoom', style: 'width:100%',
    });
    zoomInput.addEventListener('input', () => {
      zoom = Number(zoomInput.value) / 100;
      clamp(); draw();
    });

    // ---- picking a file --------------------------------------------------
    const file = el('input', { type: 'file', accept: r.formats.join(',') });
    const note = el('p', { className: 'note' });
    const sizeNote = el('p', { className: 'note' });

    file.addEventListener('change', () => {
      const f = file.files && file.files[0];
      if (!f) return;
      const url = URL.createObjectURL(f);
      const loaded = new Image();
      loaded.onload = () => {
        URL.revokeObjectURL(url);
        img = loaded;
        zoom = 1; zoomInput.value = '100'; offX = 0; offY = 0;
        clamp(); draw();
        const small = Math.min(img.width, img.height);
        // Enlarging past the source cannot add detail, so say so rather than
        // letting somebody upload a blurred tile and wonder why.
        note.textContent = small < r.min_px
          ? `That picture is ${img.width}x${img.height}. Below ${r.min_px}px `
            + `it will look soft on a till — use a larger one if you have it.`
          : `${img.width}x${img.height} — plenty. Drag to choose what shows, `
            + `and zoom in if you want a closer crop.`;
        note.className = small < r.min_px ? 'note warn' : 'note';
        updateSize();
      };
      loaded.onerror = () => {
        error.textContent = 'That file could not be read as an image.';
        error.classList.remove('hidden');
      };
      loaded.src = url;
    });

    /// What this crop will actually weigh, shown before it is sent.
    let exported = null;
    async function updateSize() {
      exported = await encode();
      sizeNote.textContent = exported
        ? `Will be saved as ${r.ideal_px}x${r.ideal_px} JPEG, ${kb(exported.bytes.length)}`
        : '';
    }

    /// Export at the till's own resolution, stepping quality down until it
    /// fits. Quality is the thing to give up: a tile is 150px on the biggest
    /// screen we sell to, and nobody has ever noticed q0.6 at that size.
    async function encode() {
      if (!img) return null;
      const out = el('canvas', { width: r.ideal_px, height: r.ideal_px });
      draw(out, r.ideal_px);
      for (const q of [0.85, 0.75, 0.65, 0.55, 0.45]) {
        const blob = await new Promise(res => out.toBlob(res, 'image/jpeg', q));
        if (!blob) return null;
        const bytes = new Uint8Array(await blob.arrayBuffer());
        if (bytes.length <= r.max_bytes) return { bytes, quality: q };
      }
      return null;
    }

    zoomInput.addEventListener('change', updateSize);
    canvas.addEventListener('pointerup', updateSize);

    // ---- the dialog -------------------------------------------------------
    box.append(
      el('h2', { textContent: `Picture for ${name}` }),
      error,
      el('p', { className: 'note', textContent:
        `Square, at least ${r.min_px}x${r.min_px} pixels — ${r.ideal_px}x${r.ideal_px} `
        + `or larger is ideal. JPEG, PNG or WebP. Whatever you choose is cropped `
        + `to a square and saved at ${r.ideal_px}x${r.ideal_px}, under `
        + `${kb(r.max_bytes)}, because that is the size a till button draws. `
        + `It reaches the tills on their next sync.` }),
      el('div', { className: 'field' }, [file]),
      el('div', { className: 'cropwrap' }, [canvas]),
      el('div', { className: 'field' }, [
        el('label', { textContent: 'Zoom' }), zoomInput,
      ]),
      note, sizeNote,
    );
    draw();

    const actions = el('div', { className: 'modal-actions' });
    if (hasImage) {
      const remove = el('button', { className: 'btn ghost', textContent: 'Remove picture' });
      remove.addEventListener('click', async () => {
        try {
          await api(`/products/${prodnum}/image`, { method: 'DELETE' });
          changed = true;
          toast('Picture removed — tills drop it on their next sync');
          close();
        } catch (ex) {
          error.textContent = ex.message;
          error.classList.remove('hidden');
        }
      });
      actions.append(remove);
    }
    const cancel = el('button', { className: 'btn ghost', textContent: 'Cancel' });
    cancel.addEventListener('click', close);
    const save = el('button', { className: 'btn', textContent: 'Save picture' });
    save.addEventListener('click', async () => {
      error.classList.add('hidden');
      if (!img) {
        error.textContent = 'Choose a picture first.';
        return error.classList.remove('hidden');
      }
      save.disabled = true;
      try {
        const out = exported || await encode();
        if (!out) throw new Error(
          `That crop will not fit in ${kb(r.max_bytes)}. Zoom out, or use a `
          + `simpler picture.`);
        let binary = '';
        for (const byte of out.bytes) binary += String.fromCharCode(byte);
        await api(`/products/${prodnum}/image`, {
          method: 'PUT',
          body: JSON.stringify({ mime: 'image/jpeg', data_b64: btoa(binary) }),
        });
        changed = true;
        toast('Picture saved — tills pull it on their next sync');
        close();
      } catch (ex) {
        save.disabled = false;
        error.textContent = ex.message;
        error.classList.remove('hidden');
      }
    });
    actions.append(cancel, save);
    box.append(actions);

    back.append(box);
    back.addEventListener('click', e => { if (e.target === back) close(); });
    document.body.append(back);
  });
}

async function onCell(screen, button, x, y) {
  // Holding one? Then this click is a destination.
  if (heldButtonId) {
    if (button && button.id === heldButtonId) {
      heldButtonId = null;               // put it back down
      return renderMenu();
    }
    try {
      await api('/menu-buttons/' + heldButtonId, { method: 'PATCH',
        body: JSON.stringify({ pos_x: x, pos_y: y }) });
      heldButtonId = null;
      renderMenu();
    } catch (ex) { toast(ex.message); }
    return;
  }

  if (button) {
    heldButtonId = button.id;
    return renderMenu();
  }

  const prodnum = await pickProduct();
  if (!prodnum) return;
  try {
    await api(`/menu-screens/${screen.id}/buttons`, { method: 'POST',
      body: JSON.stringify({ prodnum, pos_x: x, pos_y: y }) });
    renderMenu();
  } catch (ex) { toast(ex.message); }
}

// ---- the menus level: the grid of page tiles a till lands on ------------

async function renderMenuGrid() {
  loading('menu');
  try {
    const menus = await api('/menus');
    const wrap = el('div', { className: 'master' });

    const list = el('section', { className: 'panel' },
      [el('h2', { textContent: 'Menus' }), levelSwitch()]);
    const rows = el('div', { className: 'list' });
    for (const m of menus) {
      const row = el('button', {
        className: 'listrow' + (m.id === selectedMenuId ? ' on' : ''),
      });
      row.append(
        el('div', { className: 'listmain' }, [
          el('span', { textContent: m.name }),
          m.is_active ? el('span')
            : el('span', { className: 'pill bad', textContent: 'inactive' }),
        ]),
        el('div', { className: 'listsub' }, [
          el('span', { className: 'muted', textContent: '#' + m.menu_no }),
          el('span', { className: 'muted',
            textContent: m.page_count + ' pages' }),
        ]),
      );
      row.addEventListener('click', () => {
        selectedMenuId = m.id; renderMenu();
      });
      rows.append(row);
    }
    list.append(rows);
    wrap.append(list, el('div', { id: 'menuCanvas' }));
    into('menu', wrap);

    const chosen = menus.find(m => m.id === selectedMenuId) || menus[0];
    if (chosen) { selectedMenuId = chosen.id; await openMenu(chosen); }
  } catch (ex) { failed('menu', ex); }
}

async function openMenu(menu) {
  const host = $('#menuCanvas');
  host.replaceChildren(el('p', { className: 'note', textContent: 'Loading…' }));

  let pages, screens;
  try {
    [pages, screens] = await Promise.all([
      api(`/menus/${menu.id}/pages`),
      api('/menu-screens'),
    ]);
  } catch (ex) {
    return host.replaceChildren(el('p', { className: 'err', textContent: ex.message }));
  }

  const across = Math.min(20, Math.max(menu.used_across + 1, 4));
  const down = Math.min(20, Math.max(menu.used_down + 1, 3));
  const byCell = new Map();
  for (const p of pages) byCell.set(`${p.pos_x},${p.pos_y}`, p);

  const panel = el('section', { className: 'panel' },
    [el('h2', { textContent: `${menu.name}  ·  menu ${menu.menu_no}` })]);

  const grid = el('div', { className: 'menugrid' });
  grid.style.gridTemplateColumns = `repeat(${across}, minmax(110px, 1fr))`;

  for (let y = 1; y <= down; y++) {
    for (let x = 1; x <= across; x++) {
      const p = byCell.get(`${x},${y}`);
      const cell = el('button', {
        className: 'cell' + (p ? ' filled' : ''),
        title: p ? `${p.name} · page ${p.screen_no}` : `Empty  (${x}, ${y})`,
      });
      if (p) {
        cell.style.background = p.back_color || '';
        cell.style.color = p.fore_color || '';
        cell.append(
          el('span', { className: 'celltext', textContent: p.name }),
          el('span', { className: 'cellprice',
            textContent: p.button_count + ' buttons' }),
        );
      }
      cell.addEventListener('click', () => onMenuCell(menu, p, x, y, screens));
      grid.append(cell);
    }
  }
  panel.append(el('div', { className: 'scroll' }, grid));
  panel.append(el('p', { className: 'note', textContent:
    'This is the grid a till opens on. Click a tile to open that page’s '
    + 'buttons, or an empty cell to put a page here. Colours come from the '
    + 'page itself.' }));

  host.replaceChildren(panel);
}

async function onMenuCell(menu, page, x, y, screens) {
  if (page) {
    // Drill into the page's own button grid — the move a cashier makes.
    const screen = screens.find(s => s.menu_id === page.screen_no);
    if (screen) {
      selectedScreenId = screen.id;
      menuLevel = 'pages';
      return renderMenu();
    }
    return toast('That page no longer exists');
  }

  const screenNo = await pickPage(screens, menu);
  if (!screenNo) return;
  try {
    await api(`/menus/${menu.id}/pages`, { method: 'POST',
      body: JSON.stringify({ screen_no: screenNo, pos_x: x, pos_y: y }) });
    renderMenu();
  } catch (ex) { toast(ex.message); }
}

/// A small form in a modal, instead of a chain of prompt() boxes.
///
/// prompt() cannot label a field, cannot show what a value is for, cannot
/// offer a choice, and cannot be cancelled halfway without losing what was
/// already typed. Setting up a floor is several fields at once, and half of
/// them are choices.
///
/// Resolves with an object of values, or null if it was cancelled. `submit`
/// may return an error string to keep the form open and say what is wrong.
function formModal({ title, fields, confirm = 'Save', submit }) {
  return new Promise(resolve => {
    const back = el('div', { className: 'modal-back' });
    const box = el('div', { className: 'modal' });
    const error = el('p', { className: 'err hidden' });
    const inputs = {};

    const close = value => {
      document.removeEventListener('keydown', onKey);
      back.remove();
      resolve(value);
    };
    const onKey = e => { if (e.key === 'Escape') close(null); };
    document.addEventListener('keydown', onKey);

    box.append(el('h2', { textContent: title }), error);

    for (const f of fields) {
      const wrap = el('div', { className: 'field' });
      wrap.append(el('label', { textContent: f.label, htmlFor: 'f-' + f.name }));
      let input;
      if (f.type === 'select') {
        input = el('select', { id: 'f-' + f.name });
        for (const o of f.options) {
          input.append(el('option', { value: o.value, textContent: o.label,
            selected: String(o.value) === String(f.value) }));
        }
      } else {
        input = el('input', {
          id: 'f-' + f.name,
          type: f.type || 'text',
          value: f.value == null ? '' : String(f.value),
          placeholder: f.placeholder || '',
        });
        if (f.min != null) input.min = String(f.min);
        if (f.max != null) input.max = String(f.max);
      }
      inputs[f.name] = input;
      wrap.append(input);
      if (f.hint) wrap.append(el('span', { className: 'hint', textContent: f.hint }));
      box.append(wrap);
    }

    const values = () => Object.fromEntries(
      Object.entries(inputs).map(([k, i]) => [k, i.value.trim()]));

    const save = el('button', { className: 'btn', textContent: confirm });
    const cancel = el('button', { className: 'btn ghost', textContent: 'Cancel' });
    cancel.addEventListener('click', () => close(null));
    save.addEventListener('click', async () => {
      const v = values();
      if (submit) {
        const problem = await submit(v);
        if (problem) {
          error.textContent = problem;
          error.classList.remove('hidden');
          return;
        }
      }
      close(v);
    });
    box.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.tagName !== 'SELECT') save.click();
    });

    back.addEventListener('click', e => { if (e.target === back) close(null); });
    box.append(el('div', { className: 'actions' }, [cancel, save]));
    back.append(box);
    document.body.append(back);
    const first = Object.values(inputs)[0];
    if (first) first.focus();
  });
}

function pickPage(screens, menu) {
  return new Promise(resolve => {
    const back = el('div', { className: 'modal-back' });
    const box = el('div', { className: 'modal' });
    const list = el('div', { className: 'list', style: 'max-height:50vh' });
    const close = v => { back.remove(); resolve(v); };

    for (const s of screens) {
      const row = el('button', { className: 'listrow' });
      row.append(
        el('div', { className: 'listmain' },
          [el('span', { textContent: s.name })]),
        el('div', { className: 'listsub' }, [
          el('span', { className: 'muted', textContent: '#' + s.menu_id }),
          el('span', { className: 'muted',
            textContent: s.button_count + ' buttons' }),
        ]),
      );
      row.addEventListener('click', () => close(s.menu_id));
      list.append(row);
    }

    const cancel = el('button', { className: 'btn ghost', textContent: 'Cancel' });
    cancel.addEventListener('click', () => close(null));
    back.addEventListener('click', e => { if (e.target === back) close(null); });

    box.append(el('h2', { textContent: `Put a page on ${menu.name}` }), list,
      el('div', { style: 'margin-top:12px' }, cancel));
    back.append(box);
    document.body.append(back);
  });
}

/// A search-as-you-type product chooser. 560 products is far too many for a
/// dropdown, and staff know items by number as well as name.
function pickProduct() {
  return new Promise(resolve => {
    const back = el('div', { className: 'modal-back' });
    const box = el('div', { className: 'modal' });
    const search = el('input', { type: 'search', placeholder: 'Name or number…',
      ariaLabel: 'Find a product' });
    const results = el('div', { className: 'list', style: 'max-height:46vh' });

    const close = value => { back.remove(); resolve(value); };

    let timer;
    const run = async () => {
      const term = search.value.trim();
      if (!term) { results.replaceChildren(
        el('p', { className: 'note', textContent: 'Type to search.' })); return; }
      try {
        const rows = await api('/products?search=' + encodeURIComponent(term));
        results.replaceChildren();
        if (!rows.length) results.append(
          el('p', { className: 'note', textContent: 'Nothing matches.' }));
        for (const p of rows.slice(0, 40)) {
          const row = el('button', { className: 'listrow' });
          row.append(
            el('div', { className: 'listmain' },
              [el('span', { textContent: p.descript })]),
            el('div', { className: 'listsub' }, [
              el('span', { className: 'muted', textContent: '#' + p.prodnum }),
              el('span', { className: 'muted', textContent: money(p.price_a) }),
            ]),
          );
          row.addEventListener('click', () => close(p.prodnum));
          results.append(row);
        }
      } catch (ex) {
        results.replaceChildren(el('p', { className: 'err', textContent: ex.message }));
      }
    };
    search.addEventListener('input', () => {
      clearTimeout(timer); timer = setTimeout(run, 200);
    });

    const cancel = el('button', { className: 'btn ghost', textContent: 'Cancel' });
    cancel.addEventListener('click', () => close(null));
    back.addEventListener('click', e => { if (e.target === back) close(null); });

    box.append(el('h2', { textContent: 'Put a product on this page' }),
      search, results, el('div', { style: 'margin-top:12px' }, cancel));
    back.append(box);
    document.body.append(back);
    search.focus();
    run();
  });
}

// ------------------------------------------------------------- floor plan
//
// A restaurant is not one room. Ground floor, first floor, terrace, family,
// singles, smoking, non-smoking: a waiter picks the area before the table, and
// the till shows exactly what is set up here. The migration can only produce
// what PixelPoint held — one section per revenue centre — so this is where the
// areas a customer actually works in get built.

let selectedAreaId = null;
let heldTableId = null;
let showRetiredTables = false;

async function renderFloor() {
  loading('floor');
  try {
    const areas = await api('/floor-sections');
    const wrap = el('div', { className: 'master' });
    wrap.append(areaList(areas), el('div', { id: 'floorCanvas' }));
    into('floor', wrap);

    const chosen = areas.find(a => a.id === selectedAreaId) || areas[0];
    if (chosen) {
      selectedAreaId = chosen.id;
      await openArea(chosen);
    } else {
      $('#floorCanvas').replaceChildren(panel('Tables',
        el('p', { className: 'note', textContent:
          'No areas yet. Add one — a ground floor, a terrace, a family '
          + 'section — and put its tables in it.' })));
    }
  } catch (ex) { failed('floor', ex); }
}

function areaList(areas) {
  const p = el('section', { className: 'panel' },
    [el('h2', { textContent: 'Areas' })]);

  const bar = el('div', { className: 'toolbar' });
  const add = el('button', { className: 'btn small', textContent: 'New area' });
  add.addEventListener('click', newArea);
  bar.append(add, el('span', { className: 'muted',
    textContent: areas.length + ' areas' }));
  p.append(bar);

  const list = el('div', { className: 'list' });
  for (const a of areas) {
    const row = el('button', {
      className: 'listrow' + (a.id === selectedAreaId ? ' on' : ''),
    });
    row.append(
      el('div', { className: 'listmain' }, [
        el('span', { textContent: a.name }),
        el('span', { className: 'muted',
          textContent: a.table_count + ' tables · ' + a.seat_count + ' seats' }),
      ]),
    );
    if (!a.is_active) row.append(
      el('span', { className: 'pill bad', textContent: 'closed' }));
    row.addEventListener('click', () => {
      selectedAreaId = a.id;
      heldTableId = null;
      renderFloor();
    });
    list.append(row);
  }
  p.append(list);
  return p;
}

async function newArea() {
  let made = null;
  const done = await formModal({
    title: 'New area',
    confirm: 'Add area',
    fields: [
      { name: 'name', label: 'Name',
        placeholder: 'Ground floor, Terrace, Family section…' },
      { name: 'code', label: 'Short code',
        hint: 'How reports and imports refer to it. Left blank, it is taken '
          + 'from the name.' },
      { name: 'sort_order', label: 'Order on the till', type: 'number',
        value: 0, min: 0 },
    ],
    submit: async v => {
      if (!v.name) return 'Give the area a name.';
      const code = (v.code || v.name).replace(/[^A-Za-z0-9]/g, '')
        .slice(0, 12).toUpperCase();
      if (!code) return 'That name has no letters to make a code from.';
      try {
        made = await api('/floor-sections', { method: 'POST',
          body: JSON.stringify({
            code, name: v.name, sort_order: Number(v.sort_order) || 0 }) });
      } catch (ex) { return ex.message; }
      return null;
    },
  });
  if (!done || !made) return;
  selectedAreaId = made.id;
  toast(made.name + ' added');
  renderFloor();
}

async function openArea(area) {
  const host = $('#floorCanvas');
  host.replaceChildren(el('p', { className: 'note', textContent: 'Loading…' }));

  const tables = await api('/tables?include_inactive=true&section_id=' + area.id);
  const live = tables.filter(t => t.is_active || showRetiredTables);
  const p = el('section', { className: 'panel' },
    [el('h2', { textContent: area.name })]);

  // ---- the area itself ----
  const bar = el('div', { className: 'toolbar' });
  const nameInput = el('input', { value: area.name, ariaLabel: 'Area name' });
  const save = el('button', { className: 'btn small', textContent: 'Rename' });
  save.addEventListener('click', async () => {
    try {
      await api('/floor-sections/' + area.id, { method: 'PATCH',
        body: JSON.stringify({ name: nameInput.value.trim() }) });
      toast('Renamed — tills show it on their next look at the floor');
      renderFloor();
    } catch (ex) { toast(ex.message); }
  });
  const close = el('button', { className: 'btn small ghost',
    textContent: area.is_active ? 'Close this area' : 'Open this area' });
  close.addEventListener('click', async () => {
    try {
      await api('/floor-sections/' + area.id, { method: 'PATCH',
        body: JSON.stringify({ is_active: !area.is_active }) });
      renderFloor();
    } catch (ex) { toast(ex.message); }
  });
  const addTable = el('button', { className: 'btn small', textContent: 'New table' });
  addTable.addEventListener('click', () => newTable(area, tables));
  // The imported plan puts tables on PixelPoint's fine canvas — five tables
  // at x = 0, 5, 10, 20, 25 — which on a one-table-per-square grid is five
  // squares in twenty-six columns of nothing. This closes the gaps up. An
  // action somebody asks for, never automatic: it moves furniture.
  const tidy = el('button', { className: 'btn small ghost',
    textContent: 'Close up the gaps' });
  tidy.addEventListener('click', async () => {
    try {
      await api('/floor-sections/' + area.id + '/tidy', { method: 'POST' });
      toast('Tidied — tills show it on their next look at the floor');
      renderFloor();
    } catch (ex) { toast(ex.message); }
  });
  bar.append(nameInput, save, addTable, tidy, close);
  p.append(bar);

  // ---- the plan ----
  // Ten by ten of the same grid the till draws, so what is arranged here is
  // what a waiter sees in the room.
  const byCell = new Map();
  // Just big enough for what is there, plus a row and column of room to place
  // into — the same rule the menu-layout editor uses for an imported page.
  let across = 4, down = 3;
  for (const t of live) {
    byCell.set(`${t.pos_x},${t.pos_y}`, t);
    across = Math.max(across, t.pos_x + 2);
    down = Math.max(down, t.pos_y + 2);
  }
  across = Math.min(across, 20);
  down = Math.min(down, 20);

  const grid = el('div', { className: 'menugrid' });
  grid.style.gridTemplateColumns = `repeat(${across}, minmax(90px, 1fr))`;
  for (let y = 0; y < down; y++) {
    for (let x = 0; x < across; x++) {
      const t = byCell.get(`${x},${y}`);
      const cell = el('button', {
        className: 'cell' + (t ? ' filled' : '')
          + (t && t.id === heldTableId ? ' held' : ''),
        title: t
          ? `Table ${t.table_no} · ${t.seats} seats${t.in_use ? ' · in use' : ''}`
          : `Empty  (${x}, ${y})`,
      });
      if (t) {
        // The number first and large, the way the till draws it: it is what
        // a waiter looks for, and the label is often empty.
        cell.append(
          el('span', { className: 'cellno', textContent: String(t.table_no) }),
          el('span', { className: 'cellprice',
            textContent: (t.label ? t.label + ' · ' : '') + t.seats + ' seats' }),
        );
        if (t.in_use) cell.append(
          el('span', { className: 'pill', textContent: 'in use' }));
        if (!t.is_active) cell.append(
          el('span', { className: 'pill bad', textContent: 'retired' }));
      }
      cell.addEventListener('click', () => onTableCell(area, t, x, y));
      grid.append(cell);
    }
  }
  p.append(el('div', { className: 'scroll' }, grid));

  const held = tables.find(t => t.id === heldTableId);
  p.append(el('p', { className: 'note', textContent: held
    ? `Holding table ${held.table_no}. Click a square to move it there.`
    : 'Click a table to pick it up and move it, or an empty square to add one. '
      + 'A table with somebody sitting at it cannot be moved — settle it '
      + 'first.' }));

  const retired = tables.filter(t => !t.is_active).length;
  if (retired) {
    const toggle = el('button', { className: 'btn small ghost',
      textContent: showRetiredTables
        ? 'Hide the ' + retired + ' retired tables'
        : 'Show ' + retired + ' retired tables' });
    toggle.addEventListener('click', () => {
      showRetiredTables = !showRetiredTables;
      renderFloor();
    });
    p.append(el('div', { style: 'padding: 0 16px 16px' }, toggle));
  }

  host.replaceChildren(p);
}

async function onTableCell(area, table, x, y) {
  // Holding one? Then this click says where it goes.
  if (heldTableId) {
    if (table && table.id === heldTableId) {
      heldTableId = null;                  // put it back down
      return renderFloor();
    }
    if (table) return toast('There is already a table there');
    try {
      await api('/tables/' + heldTableId, { method: 'PATCH',
        body: JSON.stringify({ pos_x: x, pos_y: y }) });
      heldTableId = null;
      renderFloor();
    } catch (ex) { toast(ex.message); }
    return;
  }

  if (table) return editTable(area, table);
  newTable(area, [], { x, y });
}

async function newTable(area, tables, at) {
  // Suggest the next free number across the whole branch, not just this area:
  // table numbers are branch-wide, and two of them is a bill nobody can place.
  const all = await api('/tables?include_inactive=true');
  const suggested = all.length
    ? Math.max(...all.map(t => t.table_no)) + 1 : 1;

  let added = null;
  const done = await formModal({
    title: 'New table in ' + area.name,
    confirm: 'Add table',
    fields: [
      { name: 'table_no', label: 'Table number', type: 'number',
        value: suggested, min: 1,
        hint: 'What staff and receipts call it. Unique across the branch.' },
      { name: 'seats', label: 'Seats', type: 'number', value: 2, min: 1, max: 99 },
      { name: 'label', label: 'Name (optional)',
        placeholder: 'By the window, Booth 3…' },
      { name: 'shape', label: 'Shape', type: 'select', value: 'round',
        options: [
          { value: 'round', label: 'Round' },
          { value: 'square', label: 'Square' },
          { value: 'rect', label: 'Long' },
        ] },
    ],
    submit: async v => {
      const number = Number(v.table_no);
      const seats = Number(v.seats);
      if (!Number.isInteger(number) || number < 1) return 'Table numbers are whole numbers from 1.';
      if (!Number.isInteger(seats) || seats < 1) return 'A table seats at least one.';
      try {
        added = await api('/tables', { method: 'POST', body: JSON.stringify({
          section_id: area.id,
          table_no: number,
          seats,
          label: v.label || null,
          shape: v.shape,
          pos_x: at ? at.x : 0,
          pos_y: at ? at.y : 0,
        }) });
      } catch (ex) { return ex.message; }
      return null;
    },
  });
  if (!done || !added) return;
  toast('Table ' + added.table_no + ' added');
  renderFloor();
}

async function editTable(area, table) {
  const wrap = el('div');
  const seats = el('input', { type: 'number', min: '1', max: '99',
    value: table.seats, style: 'width:80px', ariaLabel: 'Seats' });
  const label = el('input', { value: table.label || '',
    placeholder: 'Name (optional)', ariaLabel: 'Label' });

  const areas = await api('/floor-sections');
  const move = el('select', { ariaLabel: 'Area' });
  for (const a of areas) {
    move.append(el('option', { value: a.id, textContent: a.name,
      selected: a.id === table.section_id }));
  }

  const save = el('button', { className: 'btn small', textContent: 'Save' });
