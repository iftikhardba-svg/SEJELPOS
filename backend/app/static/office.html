<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS Back Office</title>
<style>
/* Same token system as the published mockups: one violet accent, neutral
   greys, and a dark mode that follows the OS. Kept deliberately small — this
   page ships inside the backend and has no build step. */
:root {
  --accent: #6d28d9;
  --accent-soft: #ede9fe;
  --bg: #f7f7f8;
  --surface: #ffffff;
  --border: #e4e4e7;
  --text: #18181b;
  --muted: #71717a;
  --danger: #dc2626;
  --danger-soft: #fef2f2;
  --ok: #16a34a;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --accent: #a78bfa;
    --accent-soft: #2e1065;
    --bg: #0b0b0e;
    --surface: #17171b;
    --border: #2a2a31;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --danger: #f87171;
    --danger-soft: #2a1215;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
button { font: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }
.hidden { display: none !important; }

/* ---- login ---- */
#login {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  width: 100%;
  max-width: 380px;
}
.card h1 { margin: 0 0 4px; font-size: 20px; }
.card p.sub { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=search], select {
  width: 100%;
  padding: 9px 11px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
}
.btn {
  background: var(--accent);
  color: #fff;
  border: 0;
  border-radius: 8px;
  padding: 10px 16px;
  font-weight: 600;
}
.btn:disabled { opacity: .55; cursor: default; }
.btn.ghost {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--border);
}
.btn.small { padding: 6px 10px; font-size: 13px; }
.err {
  background: var(--danger-soft);
  color: var(--danger);
  border-radius: 8px;
  padding: 9px 11px;
  font-size: 13px;
  margin-top: 12px;
}
.check {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 16px 0 0;
  font-size: 14px;
  color: var(--text);
  cursor: pointer;
}
.check input { width: auto; margin: 0; }
.fine { color: var(--muted); font-size: 12px; margin: 14px 0 0; line-height: 1.45; }

/* ---- shell ---- */
header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 5;
}
header .brand { font-weight: 700; }
header .who { margin-left: auto; color: var(--muted); font-size: 13px; }
nav { display: flex; gap: 4px; padding: 12px 20px 0; flex-wrap: wrap; }
nav button {
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 8px 14px;
  color: var(--muted);
  font-weight: 600;
}
nav button.on { background: var(--accent-soft); color: var(--accent); }
main { padding: 20px; max-width: 1180px; }

/* ---- widgets ---- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.tile .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.tile .v { font-size: 26px; font-weight: 700; margin-top: 4px; }
.tile.warn { border-color: var(--danger); }
.tile.warn .v { color: var(--danger); }
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-top: 18px;
  overflow: hidden;
}
.panel > h2 {
  margin: 0;
  padding: 13px 16px;
  font-size: 14px;
  border-bottom: 1px solid var(--border);
}
.panel .body { padding: 16px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.bad { background: var(--danger-soft); color: var(--danger); }
.toolbar { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.toolbar input[type=search] { max-width: 260px; }
.muted { color: var(--muted); }
.note { color: var(--muted); font-size: 13px; padding: 16px; }
input.price { width: 100px; text-align: right; font-variant-numeric: tabular-nums; }
.code {
  font-family: ui-monospace, Consolas, monospace;
  background: var(--accent-soft);
  color: var(--accent);
  padding: 10px 12px;
  border-radius: 8px;
  word-break: break-all;
  font-size: 13px;
  margin-top: 10px;
}
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.row > div { flex: 1 1 150px; }
/* ---- product master-detail ---- */
.master { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 16px; align-items: start; }
@media (max-width: 900px) { .master { grid-template-columns: 1fr; } }
.master .panel { margin-top: 0; }
.list { max-height: 62vh; overflow-y: auto; }
.listrow {
  display: block; width: 100%; text-align: left; background: transparent;
  border: 0; border-bottom: 1px solid var(--border); padding: 10px 16px;
  color: inherit; font: inherit;
}
.listrow:hover { background: var(--bg); }
.listrow.on { background: var(--accent-soft); }
.listmain { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.listsub { display: flex; gap: 10px; font-size: 12px; margin-top: 2px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { margin: 0; }
.hint { color: var(--muted); font-size: 12px; line-height: 1.45; }
.sub-head { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 26px 0 6px; }
.prices { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.prices input { text-align: right; font-variant-numeric: tabular-nums; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.checks .check { margin: 0; }
textarea {
  width: 100%; padding: 9px 11px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--bg); font: inherit; resize: vertical;
}
input[type=color] { width: 56px; height: 34px; padding: 2px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
.tile-preview {
  border: 1px solid var(--border); border-radius: 10px; padding: 10px;
  min-height: 84px; display: flex; align-items: flex-start;
  font-size: 13px; font-weight: 600; white-space: pre-line; line-height: 1.3;
}

#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 8px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .18s;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>

<section id="login">
  <!-- A real form with named fields and an action, because that is what a
       browser password manager looks for before it offers to save anything.
       The submit is intercepted, but the shape has to be right. -->
  <form class="card" id="loginForm" method="post" action="/office">
    <h1>POS Back Office</h1>
    <p class="sub">Sign in with the account your provider set up.</p>
    <label for="email">Email</label>
    <input id="email" name="username" type="email" autocomplete="username"
           autocapitalize="none" spellcheck="false" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>
    <label class="check">
      <input id="remember" type="checkbox">
      <span>Keep me signed in on this device</span>
    </label>
    <div style="margin-top:18px"><button class="btn" style="width:100%" id="loginBtn" type="submit">Sign in</button></div>
    <div id="loginErr" class="err hidden"></div>
    <p class="fine">
      Your password is saved by the browser, not by this page. On a till or a
      shared office machine, leave the box unticked.
    </p>
  </form>
</section>

<div id="app" class="hidden">
  <header>
    <span class="brand">POS Back Office</span>
    <span id="company" class="muted"></span>
    <span class="who"><span id="who"></span> · <a href="#" id="logout">Sign out</a></span>
  </header>
  <nav>
    <button data-tab="dashboard" class="on">Dashboard</button>
    <button data-tab="products">Products &amp; prices</button>
    <button data-tab="devices">Devices</button>
    <button data-tab="sales">Sales</button>
  </nav>
  <main>
    <section id="tab-dashboard"></section>
    <section id="tab-products" class="hidden"></section>
    <section id="tab-devices" class="hidden"></section>
    <section id="tab-sales" class="hidden"></section>
  </main>
</div>

<div id="toast"></div>

<script>
'use strict';

// Where the SESSION TOKEN lives — never the password. Storing a password in
// the browser's storage would put a working credential in reach of any script
// on the page; saving it is the password manager's job, which is why the form
// above is a real form with autocomplete attributes.
//
// sessionStorage by default, so a shared back-office machine forgets when the
// tab closes. "Keep me signed in" moves it to localStorage, which survives a
// restart — but only until the token's own 12-hour expiry, which no checkbox
// extends.
const KEY = 'pos.office.token';
const store = () =>
  localStorage.getItem(KEY) ? localStorage : sessionStorage;
let token = localStorage.getItem(KEY) || sessionStorage.getItem(KEY) || '';
let branches = [];

const $ = (s, r = document) => r.querySelector(s);
const el = (t, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(t), props);
  for (const k of [].concat(kids)) n.append(k);
  return n;
};

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

// Halalas are the unit everywhere in this product. The conversion to a decimal
// happens here and only here, so no arithmetic upstream ever sees a float.
const money = h => (h == null ? '—' : (h / 100).toFixed(2));
const parseMoney = s => {
  const v = Number(String(s).trim());
  return Number.isFinite(v) && v >= 0 ? Math.round(v * 100) : null;
};
const when = iso => {
  if (!iso) return 'never';
  const d = new Date(iso);
  return d.toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'short' });
};

async function api(path, opts = {}) {
  const res = await fetch('/v1/office' + path, {
    ...opts,
    headers: {
      'content-type': 'application/json',
      ...(token ? { authorization: 'Bearer ' + token } : {}),
      ...(opts.headers || {}),
    },
  });
  if (res.status === 401) { signOut(); throw new Error('Session expired — sign in again'); }
  const body = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw new Error((body && (body.detail || body.message)) || ('Request failed (' + res.status + ')'));
  return body;
}

// ---------------------------------------------------------------- session

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'), err = $('#loginErr');
  btn.disabled = true;
  err.classList.add('hidden');
  try {
    const out = await api('/login', {
      method: 'POST',
      body: JSON.stringify({ email: $('#email').value, password: $('#password').value }),
    });
    token = out.token;
    // Write to one and clear the other, so unticking the box on a shared
    // machine actually forgets rather than leaving a stale token behind.
    const keep = $('#remember').checked;
    (keep ? localStorage : sessionStorage).setItem(KEY, token);
    (keep ? sessionStorage : localStorage).removeItem(KEY);
    await start(out);
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.remove('hidden');
  } finally {
    btn.disabled = false;
  }
});

function signOut() {
  token = '';
  // Both, unconditionally: signing out has to mean signed out wherever the
  // token happened to be kept.
  localStorage.removeItem(KEY);
  sessionStorage.removeItem(KEY);
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#password').value = '';
}
$('#logout').addEventListener('click', e => { e.preventDefault(); signOut(); });

async function start(me) {
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#who').textContent = me.name + ' (' + me.role + ')';
  $('#company').textContent = me.company_name;
  try { branches = await api('/branches'); } catch { branches = []; }
  show('dashboard');
}

document.querySelectorAll('nav button').forEach(b =>
  b.addEventListener('click', () => show(b.dataset.tab)));

function show(tab) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  ['dashboard', 'products', 'devices', 'sales'].forEach(t =>
    $('#tab-' + t).classList.toggle('hidden', t !== tab));
  ({ dashboard: renderDashboard, products: renderProducts, devices: renderDevices, sales: renderSales })[tab]();
}

function into(id, node) {
  const host = $('#tab-' + id);
  host.replaceChildren(node);
}
function panel(title, child) {
  const p = el('section', { className: 'panel' }, [el('h2', { textContent: title })]);
  p.append(child);
  return p;
}
function loading(id) { into(id, el('p', { className: 'note', textContent: 'Loading…' })); }
function failed(id, ex) { into(id, el('p', { className: 'err', textContent: ex.message })); }

// -------------------------------------------------------------- dashboard

async function renderDashboard() {
  loading('dashboard');
  try {
    const d = await api('/dashboard');
    const wrap = el('div');

    const tiles = el('div', { className: 'tiles' });
    const tile = (k, v, warn) => {
      const t = el('div', { className: 'tile' + (warn ? ' warn' : '') });
      t.append(el('div', { className: 'k', textContent: k }));
      t.append(el('div', { className: 'v', textContent: v }));
      return t;
    };
    tiles.append(
      tile('Sales today', d.sale_count),
      tile('Gross (SAR)', money(d.gross_total)),
      tile('VAT (SAR)', money(d.vat_total)),
      tile('Net (SAR)', money(d.net_total)),
      // These two are the point of the dashboard. An unsigned sale is not a
      // queue that drains — it is an invoice that was never legally issued.
      tile('Unsigned sales', d.unsigned_sales, d.unsigned_sales > 0),
      tile('Silent devices', d.silent_devices, d.silent_devices > 0),
    );
    wrap.append(tiles);

    if (d.unsigned_sales > 0) {
      wrap.append(el('div', { className: 'err', style: 'margin-top:16px',
        textContent: d.unsigned_sales + ' sale(s) today closed without a ZATCA stamp. ' +
          'Those receipts are not tax invoices and the server refused them. Check the ' +
          'device is provisioned for signing, then see the Sales tab.' }));
    }

    const table = el('table');
    table.append(el('thead', {}, el('tr', {}, [
      el('th', { textContent: 'Sale type' }),
      el('th', { className: 'num', textContent: 'Count' }),
      el('th', { className: 'num', textContent: 'Gross (SAR)' }),
    ])));
    const tb = el('tbody');
    if (!d.by_sale_type.length) {
      tb.append(el('tr', {}, el('td', { colSpan: 3, className: 'muted', textContent: 'No sales on ' + d.business_date })));
    }
    for (const r of d.by_sale_type) {
      tb.append(el('tr', {}, [
        el('td', { textContent: r.name }),
        el('td', { className: 'num', textContent: r.count }),
        el('td', { className: 'num', textContent: money(r.gross) }),
      ]));
    }
    table.append(tb);
    wrap.append(panel('Trade mix — ' + d.business_date, el('div', { className: 'scroll' }, table)));
    into('dashboard', wrap);
  } catch (ex) { failed('dashboard', ex); }
}

// --------------------------------------------------------------- products

// Master-detail, the shape of the product screen this replaces: a browsable
// list on the left, one product open on the right. With 560 products a flat
// table with inline price boxes stops being navigable.
let productSearch = '', zeroOnly = false, categoryFilter = '';
let selectedProductId = null;
let categories = [], stations = [];

const TIERS = 'abcdefghij'.split('');
// Which tier a sale type charges is configured per type; A and B are the two
// that carry the money at this customer, so they lead and are labelled.
const TIER_LABEL = { a: 'A · Walk-in', b: 'B · Aggregator', j: 'J · Comp' };

async function renderProducts() {
  loading('products');
  try {
    if (!categories.length) {
      try { categories = await api('/report-categories'); } catch { categories = []; }
    }
    if (!stations.length) {
      try { stations = await api('/kitchen-stations'); } catch { stations = []; }
    }

    const qs = new URLSearchParams();
    if (productSearch) qs.set('search', productSearch);
    if (zeroOnly) qs.set('only_zero_price', 'true');
    if (categoryFilter) qs.set('report_no', categoryFilter);
    const rows = await api('/products' + (qs.toString() ? '?' + qs : ''));

    const wrap = el('div', { className: 'master' });
    wrap.append(productList(rows), el('div', { id: 'productDetail' }));
    into('products', wrap);

    if (selectedProductId && rows.some(r => r.id === selectedProductId)) {
      openProduct(selectedProductId);
    } else {
      showDetailPlaceholder(rows.length);
    }
  } catch (ex) { failed('products', ex); }
}

function productList(rows) {
  const panel = el('section', { className: 'panel' },
    [el('h2', { textContent: 'Products' })]);

  const bar = el('div', { className: 'toolbar' });
  const search = el('input', { type: 'search', value: productSearch,
    placeholder: 'Name or number…', ariaLabel: 'Search products' });
  search.addEventListener('change', () => {
    productSearch = search.value; renderProducts();
  });

  const cat = el('select', { ariaLabel: 'Filter by report category' });
  cat.append(el('option', { value: '', textContent: 'All categories' }));
  for (const c of categories) {
    cat.append(el('option', {
      value: String(c.report_no),
      textContent: `${c.name} (${c.product_count})`,
      selected: String(c.report_no) === categoryFilter,
    }));
  }
  cat.addEventListener('change', () => {
    categoryFilter = cat.value; renderProducts();
  });

  const zbtn = el('button', { className: 'btn small ' + (zeroOnly ? '' : 'ghost'),
    textContent: 'Priced zero' });
  zbtn.addEventListener('click', () => { zeroOnly = !zeroOnly; renderProducts(); });

  const add = el('button', { className: 'btn small', textContent: 'New product' });
  add.addEventListener('click', () => openProduct(null));

  bar.append(search, cat, zbtn, add);
  panel.append(bar);

  const list = el('div', { className: 'list' });
  for (const p of rows) {
    const row = el('button', {
      className: 'listrow' + (p.id === selectedProductId ? ' on' : ''),
    });
    row.append(
      el('div', { className: 'listmain' }, [
        el('span', { textContent: p.descript }),
        p.is_active ? el('span') :
          el('span', { className: 'pill bad', textContent: 'inactive' }),
      ]),
      el('div', { className: 'listsub' }, [
        el('span', { className: 'muted', textContent: '#' + p.prodnum }),
        el('span', { className: 'muted', textContent: money(p.price_a) }),
      ]),
    );
    row.addEventListener('click', () => {
      selectedProductId = p.id;
      document.querySelectorAll('.listrow.on')
        .forEach(n => n.classList.remove('on'));
      row.classList.add('on');
      openProduct(p.id);
    });
    list.append(row);
  }
  if (!rows.length) {
    list.append(el('p', { className: 'note', textContent: 'Nothing matches.' }));
  }
  panel.append(list);
  panel.append(el('p', { className: 'note',
    textContent: rows.length + ' shown' }));
  return panel;
}

function showDetailPlaceholder(count) {
  $('#productDetail').replaceChildren(
    el('section', { className: 'panel' }, [
      el('h2', { textContent: 'Product setup' }),
      el('p', { className: 'note', textContent: count
        ? 'Pick a product on the left, or add a new one.'
        : 'No products match the current filter.' }),
    ]),
  );
}

async function openProduct(id) {
  const host = $('#productDetail');
  host.replaceChildren(el('p', { className: 'note', textContent: 'Loading…' }));

  let p;
  if (id) {
    try { p = await api('/products/' + id); }
    catch (ex) { return host.replaceChildren(
      el('p', { className: 'err', textContent: ex.message })); }
  } else {
    // A blank product. price_a is required by the API, so it starts at zero
    // and the zero-price filter will find it until someone sets it.
    p = { prodnum: '', descript: '', descript_ar: '', print_des: '',
          price_a: 0, tax_applies: true, is_weighed: false,
          manual_price: false, is_modifier: false, is_active: true,
          print_loc: 0, ref_code: '', unit_des: '', menu_ids: [] };
    for (const t of TIERS) if (p['price_' + t] == null) p['price_' + t] = null;
  }

  const isNew = !id;
  const fields = {};
  const form = el('div', { className: 'body' });

  const field = (label, control, hint) => {
    const box = el('div', { className: 'field' });
    box.append(el('label', { textContent: label }));
    box.append(control);
    if (hint) box.append(el('div', { className: 'hint', textContent: hint }));
    return box;
  };
  const text = (key, value, opts = {}) => {
    const input = el('input', Object.assign(
      { type: 'text', value: value ?? '' }, opts));
    fields[key] = input;
    return input;
  };

  // ---- identity ----
  const idRow = el('div', { className: 'row' });
  idRow.append(
    field('Product number', text('prodnum', p.prodnum,
      { type: 'number', min: '1', disabled: !isNew }),
      isNew ? 'Used by kitchen tickets and reports. Cannot be changed later.'
            : 'Fixed once created.'),
    field('Description', text('descript', p.descript)),
  );
  form.append(idRow);

  const nameRow = el('div', { className: 'row' });
  nameRow.append(
    field('Arabic name', text('descript_ar', p.descript_ar),
      'Printed on the receipt. ZATCA expects Arabic.'),
    field('Kitchen ticket name', text('print_des', p.print_des),
      'What the kitchen sees. Blank uses the description.'),
  );
  form.append(nameRow);

  const metaRow = el('div', { className: 'row' });
  const catSel = el('select');
  catSel.append(el('option', { value: '', textContent: '— none —' }));
  for (const c of categories) {
    catSel.append(el('option', { value: String(c.report_no),
      textContent: c.name, selected: c.report_no === p.report_no }));
  }
  fields.report_no = catSel;
  metaRow.append(
    field('Report category', catSel, 'What sales reports group this under.'),
    field('Reference code', text('ref_code', p.ref_code)),
    field('Unit', text('unit_des', p.unit_des), 'e.g. KG for weighed items.'),
  );
  form.append(metaRow);

  // ---- pricing ----
  form.append(el('h3', { className: 'sub-head', textContent: 'Pricing' }));
  form.append(el('p', { className: 'hint', textContent:
    'VAT-inclusive, in SAR. The sale type decides which tier is charged — ' +
    'aggregators pay B, and the gap from A is their commission. Leaving B ' +
    'empty does not fall back to A: the till refuses the sale instead.' }));

  const priceGrid = el('div', { className: 'prices' });
  for (const t of TIERS) {
    const value = p['price_' + t];
    const input = el('input', {
      type: 'number', step: '0.01', min: '0',
      value: value == null ? '' : money(value),
      placeholder: t === 'a' ? '0.00' : '—',
      ariaLabel: 'Price ' + t.toUpperCase(),
    });
    fields['price_' + t] = input;
    priceGrid.append(field(TIER_LABEL[t] || t.toUpperCase(), input));
  }
  form.append(priceGrid);

  // ---- routing ----
  form.append(el('h3', { className: 'sub-head', textContent: 'Kitchen routing' }));
  const routing = el('div', { className: 'checks' });
  const stationBoxes = [];
  for (const s of stations) {
    const box = el('input', { type: 'checkbox',
      checked: (p.print_loc & (1 << s.station_no)) !== 0,
      ariaLabel: 'Send to ' + s.name });
    stationBoxes.push({ box, station_no: s.station_no });
    routing.append(el('label', { className: 'check' }, [box,
      el('span', { textContent: s.name })]));
  }
  if (!stations.length) {
    routing.append(el('p', { className: 'hint',
      textContent: 'No kitchen stations configured for this branch.' }));
  }
  form.append(routing);
  form.append(el('p', { className: 'hint', textContent:
    'Station numbers are the printer ports carried over from the old system, ' +
    'so imported routing keeps working. Nothing ticked means no kitchen ticket.' }));

  // ---- till button ----
  form.append(el('h3', { className: 'sub-head', textContent: 'Till button' }));
  form.append(el('p', { className: 'hint', textContent:
    'What the cashier sees. The label is separate from the description ' +
    'because a tile has to fit it, and the colour is how staff find an item ' +
    'before they read it — the imported menu uses 28 of them.' }));

  const btnRow = el('div', { className: 'row' });
  const btnText = el('textarea', { rows: 3, value: p.button_text || '',
    placeholder: p.descript, ariaLabel: 'Button label' });
  fields.button_text = btnText;

  const colour = (key, label) => {
    const value = p[key];
    const picker = el('input', { type: 'color', value: value || '#FFFFFF',
      ariaLabel: label, disabled: !value });
    const useTheme = el('input', { type: 'checkbox', checked: !value,
      ariaLabel: label + ': use the theme' });
    useTheme.addEventListener('change', () => {
      picker.disabled = useTheme.checked;
      preview();
    });
    picker.addEventListener('input', preview);
    fields[key] = { picker, useTheme };
    return el('div', {}, [
      picker,
      el('label', { className: 'check' }, [useTheme,
        el('span', { textContent: 'Use theme' })]),
    ]);
  };

  const previewTile = el('div', { className: 'tile-preview' });
  function preview() {
    const back = fields.back_color.useTheme.checked
      ? '' : fields.back_color.picker.value;
    const fore = fields.fore_color.useTheme.checked
      ? '' : fields.fore_color.picker.value;
    previewTile.style.background = back || 'var(--surface)';
    previewTile.style.color = fore || 'var(--text)';
    previewTile.textContent =
      (btnText.value || fields.descript.value || p.descript || '').trim();
  }
  btnText.addEventListener('input', preview);

  btnRow.append(
    field('Button label', btnText, 'One line per row. Blank uses the description.'),
    field('Background', colour('back_color', 'Button background')),
    field('Text colour', colour('fore_color', 'Button text colour')),
    field('Preview', previewTile),
  );
  form.append(btnRow);
  preview();

  // ---- flags ----
  form.append(el('h3', { className: 'sub-head', textContent: 'Behaviour' }));

  const flags = el('div', { className: 'checks' });
  const flag = (key, label, hint) => {
    const box = el('input', { type: 'checkbox', checked: !!p[key],
      ariaLabel: label });
    fields[key] = box;
    flags.append(el('label', { className: 'check', title: hint || '' },
      [box, el('span', { textContent: label })]));
  };
  flag('is_active', 'Available on tills');
  flag('tax_applies', 'VAT applies');
  flag('is_weighed', 'Sold by weight');
  flag('manual_price', 'Price typed at the till');
  flag('is_modifier', 'Modifier, not a menu item');
  form.append(flags);

  // ---- where it appears ----
  if (!isNew) {
    form.append(el('h3', { className: 'sub-head', textContent: 'On menu screens' }));
    form.append(el('p', { className: 'hint', textContent: p.menu_ids.length
      ? 'Screens ' + p.menu_ids.join(', ') +
        '. Moving buttons is a menu-layout job, not done here.'
      : 'Not on any menu screen, so no till can ring it.' }));
  }

  // ---- save ----
  const save = el('button', { className: 'btn',
    textContent: isNew ? 'Create product' : 'Save changes' });
  const actions = el('div', { style: 'margin-top:20px; display:flex; gap:8px' });
  actions.append(save);
  if (!isNew) {
    const cancel = el('button', { className: 'btn ghost', textContent: 'Revert' });
    cancel.addEventListener('click', () => openProduct(id));
    actions.append(cancel);
  }
  form.append(actions);

  save.addEventListener('click', async () => {
    const body = {};
    const put = (key, value) => { if (isNew || value !== p[key]) body[key] = value; };

    if (isNew) {
      const num = Number(fields.prodnum.value);
      if (!Number.isInteger(num) || num < 1) {
        return toast('Product number must be a whole number');
      }
      body.prodnum = num;
    }
    if (!fields.descript.value.trim()) return toast('Description is required');
    put('descript', fields.descript.value.trim());

    for (const key of ['descript_ar', 'print_des', 'ref_code', 'unit_des']) {
      put(key, fields[key].value.trim() || null);
    }
    body.report_no = fields.report_no.value ? Number(fields.report_no.value) : null;

    for (const t of TIERS) {
      const raw = fields['price_' + t].value.trim();
      if (raw === '') {
        if (t === 'a') return toast('Walk-in price (A) is required');
        put('price_' + t, null);
      } else {
        const halalas = parseMoney(raw);
        if (halalas === null) return toast(`Price ${t.toUpperCase()} must be a number`);
        put('price_' + t, halalas);
      }
    }

    let printLoc = 0;
    for (const { box, station_no } of stationBoxes) {
      if (box.checked) printLoc |= (1 << station_no);
    }
    // Bits for ports with no configured station are preserved, so editing a
    // product does not quietly unroute it from a station nobody has named.
    const known = stations.reduce((m, s) => m | (1 << s.station_no), 0);
    put('print_loc', printLoc | (p.print_loc & ~known));

    for (const key of ['is_active', 'tax_applies', 'is_weighed',
                       'manual_price', 'is_modifier']) {
      put(key, fields[key].checked);
    }

    put('button_text', fields.button_text.value.trim() || null);
    for (const key of ['fore_color', 'back_color']) {
      const { picker, useTheme } = fields[key];
      // Uppercase to match what the migration writes, so a save with no
      // visible change does not register as one.
      put(key, useTheme.checked ? null : picker.value.toUpperCase());
    }

    if (!isNew && !Object.keys(body).length) return toast('Nothing changed');

    save.disabled = true;
    try {
      if (isNew) {
        const made = await api('/products', {
          method: 'POST', body: JSON.stringify(body) });
        selectedProductId = made.id;
        toast(made.descript + ' created — put it on a menu screen to sell it');
      } else {
        await api('/products/' + id, {
          method: 'PATCH', body: JSON.stringify(body) });
        toast('Saved — tills will pull it on their next sync');
      }
      categories = [];
      await renderProducts();
    } catch (ex) {
      toast(ex.message);
    } finally {
      save.disabled = false;
    }
  });

  host.replaceChildren(el('section', { className: 'panel' }, [
    el('h2', { textContent: isNew ? 'New product'
      : `${p.descript}  ·  #${p.prodnum}` }),
    form,
  ]));
}

// ---------------------------------------------------------------- devices

async function renderDevices() {
  loading('devices');
  try {
    const rows = await api('/devices');
    const wrap = el('div');

    const table = el('table');
    table.append(el('thead', {}, el('tr', {}, [
      el('th', { textContent: 'Till' }), el('th', { textContent: 'Branch' }),
      el('th', { textContent: 'Role' }), el('th', { textContent: 'Prefix' }),
      el('th', { textContent: 'ZATCA' }), el('th', { textContent: 'Last seen' }),
      el('th', { className: 'num', textContent: 'Last ICV' }),
    ])));
    const tb = el('tbody');
    for (const d of rows) {
      const signed = d.csid_status && d.csid_status !== 'none';
      tb.append(el('tr', {}, [
        el('td', { textContent: d.label }),
        el('td', { textContent: d.branch_name }),
        el('td', { textContent: d.role.toUpperCase() }),
        el('td', { textContent: d.receipt_prefix }),
        el('td', {}, el('span', { className: 'pill ' + (signed ? 'ok' : 'bad'),
          textContent: signed ? d.csid_status : 'not onboarded' })),
        el('td', { textContent: when(d.last_seen_at) }),
        el('td', { className: 'num', textContent: d.last_icv ?? '—' }),
      ]));
    }
    if (!rows.length) tb.append(el('tr', {}, el('td', { colSpan: 7, className: 'muted', textContent: 'No devices yet.' })));
    table.append(tb);
    wrap.append(panel('Devices', el('div', { className: 'scroll' }, table)));

    // Add a till
    const form = el('div', { className: 'body' });
    const branchSel = el('select');
    for (const b of branches) branchSel.append(el('option', { value: b.id, textContent: b.name }));
    const label = el('input', { type: 'text', placeholder: 'Front counter' });
    const prefix = el('input', { type: 'text', placeholder: 'T01', maxLength: 8 });
    const role = el('select');
    for (const r of ['pos', 'kds', 'cds']) role.append(el('option', { value: r, textContent: r.toUpperCase() }));
    const go = el('button', { className: 'btn', textContent: 'Create code' });
    const out = el('div');

    go.addEventListener('click', async () => {
      if (!branchSel.value) return toast('Pick a branch');
      if (!label.value.trim() || !prefix.value.trim()) return toast('Name and receipt prefix are both needed');
      go.disabled = true;
      try {
        const qs = new URLSearchParams({
          branch_id: branchSel.value, label: label.value.trim(),
          receipt_prefix: prefix.value.trim(), role: role.value,
        });
        const r = await api('/devices/enrolments?' + qs, { method: 'POST' });
        out.replaceChildren(
          el('p', { className: 'muted', style: 'margin:14px 0 0',
            textContent: 'Type this into the tablet’s setup screen. It works once and expires ' + when(r.expires_at) + '.' }),
          el('div', { className: 'code', textContent: r.code }),
        );
        renderDevices();
      } catch (ex) { toast(ex.message); } finally { go.disabled = false; }
    });

    const row = el('div', { className: 'row' });
    const field = (lbl, ctl) => el('div', {}, [el('label', { textContent: lbl }), ctl]);
    row.append(field('Branch', branchSel), field('Name', label), field('Receipt prefix', prefix), field('Role', role));
    form.append(row, el('div', { style: 'margin-top:14px' }, go), out);
    wrap.append(panel('Add a device', form));

    into('devices', wrap);
  } catch (ex) { failed('devices', ex); }
}

// ------------------------------------------------------------------ sales

let unsignedOnly = false;

async function renderSales() {
  loading('sales');
  try {
    const rows = await api('/sales' + (unsignedOnly ? '?unsigned_only=true' : ''));

    const bar = el('div', { className: 'toolbar' });
    const btn = el('button', { className: 'btn small ' + (unsignedOnly ? '' : 'ghost'), textContent: 'Unsigned only' });
    btn.addEventListener('click', () => { unsignedOnly = !unsignedOnly; renderSales(); });
    bar.append(btn, el('span', { className: 'muted', textContent: rows.length + ' shown' }));

    const table = el('table');
    table.append(el('thead', {}, el('tr', {}, [
      el('th', { textContent: 'Receipt' }), el('th', { textContent: 'Closed' }),
      el('th', { textContent: 'Type' }), el('th', { textContent: 'Ref' }),
      el('th', { className: 'num', textContent: 'Net' }), el('th', { className: 'num', textContent: 'VAT' }),
      el('th', { className: 'num', textContent: 'Total' }), el('th', { textContent: 'ZATCA' }),
      el('th', { className: 'num', textContent: 'ICV' }),
    ])));
    const tb = el('tbody');
    for (const s of rows) {
      tb.append(el('tr', {}, [
        el('td', { textContent: s.receipt_no }),
        el('td', { textContent: when(s.closed_at) }),
        el('td', { textContent: s.sale_type_name }),
        el('td', { className: 'muted', textContent: s.external_ref || (s.order_no != null ? '#' + s.order_no : '—') }),
        el('td', { className: 'num', textContent: money(s.net_total) }),
        el('td', { className: 'num', textContent: money(s.tax_total) }),
        el('td', { className: 'num', textContent: money(s.final_total) }),
        el('td', {}, el('span', { className: 'pill ' + (s.is_signed ? 'ok' : 'bad'),
          title: s.zatca_error || '', textContent: s.is_signed ? s.zatca_status : 'unsigned' })),
        el('td', { className: 'num', textContent: s.zatca_icv ?? '—' }),
      ]));
    }
    if (!rows.length) tb.append(el('tr', {}, el('td', { colSpan: 9, className: 'muted', textContent: 'No sales.' })));
    table.append(tb);

    const p = el('section', { className: 'panel' }, [el('h2', { textContent: 'Sales' }), bar,
      el('div', { className: 'scroll' }, table)]);
    into('sales', p);
  } catch (ex) { failed('sales', ex); }
}

// ------------------------------------------------------------------- boot

(async () => {
  // Reflect where the token was found, so the box matches reality rather
  // than resetting to unticked on every visit.
  $('#remember').checked = !!localStorage.getItem(KEY);
  if (!token) return;
  try { await start(await api('/me')); } catch { signOut(); }
})();
</script>
</body>
