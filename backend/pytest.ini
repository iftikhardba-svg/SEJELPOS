[pytest]
asyncio_mode = auto
# Both scopes must be session: the SQLAlchemy engine is created at import and
# its pool holds connections bound to whichever loop first used them. With a
# per-test loop, asyncpg raises "attached to a different loop" on the second
# test. SQLite hides this; PostgreSQL does not.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
addopts = -q
