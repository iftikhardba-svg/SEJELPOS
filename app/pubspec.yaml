name: pos_app
description: "Offline-first restaurant POS for Saudi Arabia. Tills, KDS and CDS are roles of this one app."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Local database. The schema is NOT defined in Dart: assets/schema.sql is a
  # copy of docs/sqlite_schema.sql, the same file the migration tooling loads,
  # so the tablet and the tooling can never disagree about the schema.
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  uuid: ^4.4.0
  http: ^1.2.0
  path_provider: ^2.1.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/schema.sql
